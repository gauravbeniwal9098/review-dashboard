-09-08", "id": "ios_10348913313", "platform": "App Store", "rating": 2, "text": "after your most recent update, none of my department managers including myself can access the days requested off by our crew. please look into it!!", "title": "bug with recent updates!!"}, {"app": "Altametrics Schedules", "author": "Melissa830", "date": "2023-08-21", "id": "ios_10283046607", "platform": "App Store", "rating": 3, "text": "It’s okay. But, the chat chat option doesn’t work for me. Notifications are on, but chit chat says to log out and back in. I did that and still doesn’t work.", "title": "Has a lot of bugs. Needs work."}, {"id": "gp_5f7d752b-c53e-449c-bded-7fa51f58960c", "platform": "Google Play", "app": "Altametrics DAR", "author": "Joshua Murphy", "title": "", "rating": 3, "date": "2023-08-18", "text": "Ever since update the biometric option has disappeared. Putting a password in every time is inconvenient and will deter me from using this app any longer. Make things easier not more complicated."}, {"app": "Altametrics Schedules", "author": "bob ur job", "date": "2023-08-18", "id": "ios_10274714700", "platform": "App Store", "rating": 1, "text": "nick ger", "title": "b word"}, {"app": "Altametrics Schedules", "author": "Leo halliwell", "date": "2023-08-17", "id": "ios_10269962933", "platform": "App Store", "rating": 1, "text": "App keeps crushing", "title": "Needs some fixing"}, {"id": "gp_4b264d94-acaa-4a0d-88a4-f23e8b756c7e", "platform": "Google Play", "app": "Altametrics DAR", "author": "Teri Sanders", "title": "", "rating": 2, "date": "2023-08-13", "text": "Slows me down due to have to log on every time I check it"}, {"id": "gp_26871292-2061-4b34-84e1-893f9a0cdace", "platform": "Google Play", "app": "Altametrics DAR", "author": "Fronk Formed-Fish", "title": "", "rating": 1, "date": "2023-08-12", "text": "Biometric unlock does not save login after the latest update. Already tried uninstall and reinstall."}, {"id": "gp_49d7be95-2339-4ad1-bf87-23b32afe6398", "platform": "Google Play", "app": "Altametrics DAR", "author": "Matthew Traczyk", "title": "", "rating": 2, "date": "2023-08-10", "text": "Biometric log in is broken."}, {"id": "gp_dba72d12-02ec-43a9-8e54-7d05df7686aa", "platform": "Google Play", "app": "Altametrics DAR", "author": "Diane Lee", "title": "", "rating": 2, "date": "2023-08-05", "text": "Ever since this latest update I haven't been able to use biometrics to log in. It's a pain when you're busy and have to take the time to enter your username and password rather than scanning your finger"}, {"id": "gp_fb1f3154-f26a-4147-9d2d-f4a03bb0419a", "platform": "Google Play", "app": "Altametrics DAR", "author": "Lori Williams", "title": "", "rating": 5, "date": "2023-07-26", "text": "I love it don't have to do any math just pull up the app and it tells you what labor is.....easy for my managers"}, {"id": "gp_c284f97b-adbc-44b5-a68f-ca5f3510ea58", "platform": "Google Play", "app": "Altametrics Clock", "author": "Kathleen Knight", "title": "", "rating": 2, "date": "2023-07-21", "text": "At least once a month I have to uninstall and reinstall the app. When i scroll down to see who is on the clock it closes the app. According to reviews, this has been happening for MONTHS. You have had time to fix this. It is not my phone (I've had several) and it is across service providers. Fix this issue. I only gave the 2 stars I did because when it works its great. Now make it work, please."}, {"id": "gp_409ce5df-aad1-4b57-a3c7-5891dd05d806", "platform": "Google Play", "app": "Altametrics DAR", "author": "Kenny Tulloch", "title": "", "rating": 2, "date": "2023-07-20", "text": "I'm an shift manager and I have tried logging in and I get an messages saying I'm not an authorized to access to this application. Please contact altametrics support. How is I had one Manger get in last night and I can't. Can't use the tools to help us in a shift if we don't have access. Please some look into and fix the problem. Thank you. Kenny"}, {"id": "gp_4e21bccc-a11c-4d47-bce4-ff3ae91ae649", "platform": "Google Play", "app": "Altametrics DAR", "author": "Xavier Manuel Flores chavez", "title": "", "rating": 2, "date": "2023-07-19", "text": "I'm just like April down there or up there... The app lets me creat username and password but I have no access.?"}, {"id": "gp_23afc17e-1187-466a-ad94-2c77db3745de", "platform": "Google Play", "app": "Altametrics Clock", "author": "Laine Wellington", "title": "", "rating": 1, "date": "2023-07-03", "text": "App repeatedly crashes when trying to view currently on clock / currently on break"}, {"app": "Altametrics Schedules", "author": "Cam ⁉️👌", "date": "2023-06-27", "id": "ios_10080437538", "platform": "App Store", "rating": 3, "text": "I hate how laggy this app is and how often it breaks, its shut down multiple times and i’ve gotten in trouble for it being down or telling me incorrect shifts. You can’t see who you’re scheduled with either, which blows. Overall too glitchy and hard to function.", "title": "Laggy and bad"}, {"id": "gp_e8b30295-b366-4fa1-b035-54571eeb261c", "platform": "Google Play", "app": "Altametrics Clock", "author": "Ariana Solis", "title": "", "rating": 1, "date": "2023-06-20", "text": "I love my new phone, i switched from Iphone to Samsung because i really like the Samsung Fold. However, I am having ALOT of issues using this app on my phone and i can see i am not the only one now. This app worked perfectly fine with Apple, I need this app for work (I use all Altametric) so if this issue cannot be resolved i am considering switching back to Iphone."}, {"app": "Altametrics Schedules", "author": "Geirokku", "date": "2023-06-08", "id": "ios_10012606803", "platform": "App Store", "rating": 1, "text": "Since I’ve started work I haven’t been able to get past the screen that asks for my timecard or employee ID. I’ve spoken to multiple of my managers about this, and my gm even tried to get in to my scheduling herself, but we were still unable to get through. \nIt always says “configure the application” no matter if what we put in is correct or not. I’m unsure if this is just a bug or not but it has done this on three of my different phones and my gm said she’s never encountered something like that before me. \nAnd so any time I need to request a day off, I have to tell her in person (which can be hard, considering we work different shifts).\nAny help with this issue would be appreciated.", "title": "Can’t get in to see schedules"}, {"app": "Altametrics Schedules", "author": "Haleigh2210473", "date": "2023-06-01", "id": "ios_9987214443", "platform": "App Store", "rating": 1, "text": "0/10!!\n\nNever works\nAlways logging you out\nNever sends a recovery email or text or call\nHalf the time doesn’t work \nHorrible to use!", "title": "Horrible"}, {"app": "Altametrics Schedules", "author": "dani.ann*", "date": "2023-06-01", "id": "ios_9989668517", "platform": "App Store", "rating": 2, "text": "I used to use this app all the time and it was perfect. About 2ish weeks ago it stopped working. I went to open it and it wouldn’t accept my password, which I knew was correct. I went to reset the password and I can’t get past the part when you’re sent the security code. It gets sent to my email, but when it is supposed to go to my phone I never get it. I’m not sure if this is just a glitch created by an update or what. Please fix this!", "title": "Went Wrong"}, {"app": "Altametrics Schedules", "author": "Coopy-Fig", "date": "2023-05-27", "id": "ios_9970812375", "platform": "App Store", "rating": 1, "text": "I have been waiting for a week for my “request to be submitted”. This app won’t even let me get past the login page to view the schedule at my new job and everyone I talked to there says even when they get in it’s one of the worst apps to ever use. From what I’ve seen it crashes constantly, is slow, and half the time the schedules are just wrong, no clue why, they just change the schedule on us. Still would be nice to even GET PAST THE LOGIN.", "title": "Cant even get past the login."}, {"id": "gp_1a711ab5-19cc-4108-ae39-d4814d0f3463", "platform": "Google Play", "app": "Altametrics Clock", "author": "Abbie Harris", "title": "", "rating": 1, "date": "2023-05-22", "text": "Doesn't even send a code to log in. The app completely stopped working"}, {"id": "gp_36c6241a-dab9-4bf1-8f54-721127e68427", "platform": "Google Play", "app": "Altametrics Clock", "author": "Jo", "title": "", "rating": 1, "date": "2023-05-22", "text": "Service appears to be shut down."}, {"app": "Altametrics Schedules", "author": "Carson Ram", "date": "2023-05-22", "id": "ios_9953426314", "platform": "App Store", "rating": 1, "text": "I used to be able to get into my account and the app was working great until one day it logs me out and I can’t log back in. I try to get the verification code to my email and to my phone and it never sends to me. I therefore rate it 1 star because I need to get into my account to see when I work but I am unable to get in and the customer service does not help because I already sent 5-6 messages so I can get back my account and not a single one was responded to. Fix this problem.", "title": "Customer Service"}, {"app": "Altametrics Schedules", "author": "chee_(3", "date": "2023-05-22", "id": "ios_9954841979", "platform": "App Store", "rating": 1, "text": "The app overall is good, but recently the app shut down which made me unable to view my work schedule.\n\nSo I tried to reset my password and now I am unable to log back in even with phone number or email.\n\nThey said they sent verification code but they won't show up and now I can't even access the login anymore with out the password reset screen popping up in stead of the regular long in.", "title": "Good But some bad things"}, {"app": "Altametrics Schedules", "author": "Magneato👌🏻👌🏻", "date": "2023-05-22", "id": "ios_9955060647", "platform": "App Store", "rating": 1, "text": "I work at McDonald’s and I have to use this app. I can’t request off because no one knows how to even look for the time off requests of this app anymore, I can’t look at my schedule without it bugging out, and now it’s booted me off and won’t let me back in. It says it’s sending some code to my email but it never does. Unbelievable. \nI wish my job didn’t have to have this but it’s quite literally the only way to see my schedule. Fix your app and do better", "title": "Horrible, slow, and always crashes"}, {"app": "Altametrics Schedules", "author": "Tomas James Moffett", "date": "2023-05-22", "id": "ios_9955092085", "platform": "App Store", "rating": 1, "text": "Never received a activation code ever", "title": "No support"}, {"app": "Altametrics Schedules", "author": "Daltontravelstead1", "date": "2023-05-22", "id": "ios_9955198158", "platform": "App Store", "rating": 1, "text": "I never get a code to active my account it was working a month ago signed me out now I can’t get my schedule", "title": "Not work"}, {"app": "Altametrics Schedules", "author": "sndbdbdbbdd", "date": "2023-05-22", "id": "ios_9955791628", "platform": "App Store", "rating": 1, "text": "It won’t let me log in", "title": "Can’t get in"}, {"id": "gp_10123dbd-93ac-40f3-8170-d87183cf136a", "platform": "Google Play", "app": "Altametrics DAR", "author": "Mandy Leibovitz", "title": "", "rating": 1, "date": "2023-05-21", "text": "Use to work great but the last 2 days hasn't worked at all. It just keeps saying service unavailable at this time."}, {"id": "gp_437981ae-3d4f-43ec-b36e-8ae72392ef0f", "platform": "Google Play", "app": "Altametrics Clock", "author": "skyarc60", "title": "", "rating": 1, "date": "2023-05-21", "text": "First it was the \"schedule\" version that stopped working properly and it's this one. What the actual f***."}, {"id": "gp_8c6fb26f-12be-432c-88b2-776d08283988", "platform": "Google Play", "app": "Altametrics Clock", "author": "Fatima Jimenez", "title": "", "rating": 1, "date": "2023-05-21", "text": "The app isn't working for me. When I put to login, it won't give me my code. I tried to uninstall the app and install it again, but nothing, so now I can't see my schedule."}, {"id": "gp_d7e0aa7c-68ad-412e-b3b9-81809d7f3cc4", "platform": "Google Play", "app": "Altametrics Clock", "author": "Tabitha Gale", "title": "", "rating": 1, "date": "2023-05-21", "text": "Won't let me in to check stuff and then won't send codes to create a new password."}, {"app": "Altametrics Schedules", "author": "the vibess😂", "date": "2023-05-21", "id": "ios_9951618370", "platform": "App Store", "rating": 1, "text": "I tried to look at my schedule yesterday and there was an error logging me in, so I logged out. When I tried to log back in and send a verification code I never got one. So I tried again and again. I’ve been trying for hours and it still doesn’t work. This app is annoying and makes me frustrated. Fix it now because I don’t know my schedule anymore.", "title": "Verification code"}, {"app": "Altametrics Schedules", "author": "Jeanette_demere", "date": "2023-05-21", "id": "ios_9951817402", "platform": "App Store", "rating": 1, "text": "It won’t let me log back in with my email and every time it says it’s sending me a verification code it doesn’t show up in my inbox.", "title": "Terrible App"}, {"app": "Altametrics Schedules", "author": "DaisyNaisy", "date": "2023-05-21", "id": "ios_9952227645", "platform": "App Store", "rating": 1, "text": "My job uses this for our scheduling. This is my first time ever using this app and even hearing about it. So basically it never really works. I can’t see my schedule all the time. This is highly inconvenient for anyone. The paper schedules is a mess so I thought how great would it be to use this app and see everything. You can only see your schedule on for that week. You really can’t see it for the whole entire month or even for the next week. I don’t like this app at all. I really wish our company would find another app for scheduling. This is not it. The constant updates are useless if it’s constantly not working. I prefer to just go old school and get a paper copy and call it day.", "title": "Stick with paper schedule"}, {"app": "Altametrics Schedules", "author": "MOAmuse", "date": "2023-05-20", "id": "ios_9946389399", "platform": "App Store", "rating": 1, "text": "I don’t know how else to contact you guys so I’ll just go through reviews. I can’t seem to get any verification code sent my way which is weird because it used to work just fine. Now I don’t know my schedule. Also I was wondering if the same email or phone number could be used across multiple scheduling accounts or if I’d need to have that changed? I tried looking it up but didn’t find anything so now I feel lost. Now when I try to open the app it won’t even load the home screen.", "title": "Multiple issues and questions"}, {"app": "Altametrics Schedules", "author": "parryjr", "date": "2023-05-20", "id": "ios_9946590164", "platform": "App Store", "rating": 2, "text": "The app randomly logs you out, then requires activation codes to let you log back on. It never sends you any codes and so you’re not able to get into the app. Make that make sense,", "title": "Needs work… like a lot of work."}, {"app": "Altametrics Schedules", "author": "Snowflakenewbie", "date": "2023-05-20", "id": "ios_9947756577", "platform": "App Store", "rating": 2, "text": "I’ve been having trouble with your app all day so I decided to delete and redownload to see if it would work and force restarting my phone but after I redownloaded the app it won’t give me the verification on my email, phone, or text so I can’t login into my schedule and I need to know my schedule! What happened before I deleted and redownloaded was that it was an error of maintenance checking or whatever and would let me login with my password or face which led me to redownloading it after deleting it", "title": "Help!"}, {"app": "Altametrics Schedules", "author": "pikbow", "date": "2023-05-20", "id": "ios_9948902830", "platform": "App Store", "rating": 1, "text": "I am freaking out because this is the only way I can see my schedule for work and I have tried everything and the app is not letting me login or give me the information to login like the codes.", "title": "Arggg"}, {"app": "Altametrics Schedules", "author": "Dahmenez", "date": "2023-05-20", "id": "ios_9949156799", "platform": "App Store", "rating": 1, "text": "The app was good at first, but then all of a sudden it signed me out then it told me to reset my password, and keeps asking for my email or phone number to activate it but won’t send me the code no matter how I much I click resend, now I don’t even know when I gotta be to work tomorrow.", "title": "Issues"}, {"app": "Altametrics Schedules", "author": "Johnnyblah1992", "date": "2023-05-20", "id": "ios_9949176347", "platform": "App Store", "rating": 1, "text": "This app is horrible it has so many bugs and needs a lot of work! It logs me out all the time it doesn’t show the correct hours I’ve worked ! I don’t know why companies use this app it’s good for nothing !!!", "title": "Horrible"}, {"app": "Altametrics Schedules", "author": "Moth_Man_3000", "date": "2023-05-19", "id": "ios_9945586382", "platform": "App Store", "rating": 1, "text": "App has been “down for maintenance” all day. Not sure what kind of maintenance takes all day for an app whose problems are never fixed or it this is just a glitch but it happens way too often for me and my coworkers. It gets really annoying when the one job the app has is to show you your schedule and it can’t even do that half the time because it won’t even let you log in to see it.", "title": "Almost always down for maintenance"}, {"id": "gp_647216ac-79ff-4427-a2b3-570da46d4939", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Ali Niblett", "title": "", "rating": 5, "date": "2023-05-14", "text": "Makes doing inventory so much easier and less time consuming"}, {"app": "Altametrics Schedules", "author": "KyBBN", "date": "2023-05-03", "id": "ios_9888690879", "platform": "App Store", "rating": 1, "text": "This app is so slow. Always has been and continually gets worse. We were paying for another vendor to pull the schedules from Altametrics but it wasn’t being highly utilized so went back to this app. It takes in excess of a minute to load messages. And that’s if it even loads at all.", "title": "Slowwwww"}, {"id": "gp_16ab9fab-17e7-4a10-91ee-a2eb73dd09dd", "platform": "Google Play", "app": "Altametrics Clock", "author": "Joni Meyer", "title": "", "rating": 1, "date": "2023-04-16", "text": "Everytime you click to see who is on the clock, the whole app crashes and reboots. Never let's me see who is clocked in. So disappointing."}, {"app": "Altametrics Schedules", "author": "MightyRufo", "date": "2023-04-16", "id": "ios_9830193686", "platform": "App Store", "rating": 2, "text": "No integration with Apple Calander? What about the fact that “today” doesn’t change when opening the app after opening it previously from a different day, yet it still takes 5 seconds for it to “refresh”. Random sms code requests which disappear after closing and reopening the app? Multiple password for internal and external access? Why? No widget support either!? How about integration with third party calendars? External access to email? Apple Mail client support? The only reason I use it, is because I have to.", "title": "A swing.. and a miss…"}, {"app": "Altametrics Schedules", "author": "MyLifeSuckz", "date": "2023-04-12", "id": "ios_9814936168", "platform": "App Store", "rating": 4, "text": "You all really need to work on your app.  90% of the time I try to get on to check and see who is on my clock or to see who’s late or hasn’t showed up it tells me I have been logged out and need to log back in.  The schedule and clock are the only ones to do this.  Fix the problem", "title": "Doesn’t let you access"}, {"app": "Altametrics Schedules", "author": "@lon3rsparadise", "date": "2023-04-08", "id": "ios_9801818203", "platform": "App St ", "date": "2022-03-05", "id": "ios_8425526376", "platform": "App Store", "rating": 1, "text": "I work for McDonald’s and, at our location, this is the app we use to manage schedules, messaging crew mates, requesting time off, etc. I’ve been required to use this app for about six months now and there hasn’t been a single time when it wasn’t like pulling teeth when trying to use it. Checking messages is one of the worst experiences I’ve ever had with any app. It takes over five minutes just to load crew mates in the chats, and an additional two minutes for the messages themselves to load. This app doesn’t make anything convenient. I’d much rather call in to change my schedule and request time off than use Altemetrics.", "title": "Unbelievably painful to use."}, {"id": "gp_5f3e7441-fd64-4f9d-bead-f2a2fb0629e8", "platform": "Google Play", "app": "Altametrics Clock", "author": "Amber Martinez", "title": "", "rating": 1, "date": "2022-03-02", "text": "It don't show me any clock only the schedule."}, {"id": "gp_d73b1651-40dd-4710-a584-ec831dfa3e77", "platform": "Google Play", "app": "Altametrics Clock", "author": "Bill Silkworth", "title": "", "rating": 3, "date": "2022-02-20", "text": "Recently, as a general manager, I cant view or edit managers' time punches. Is Says I don't have authorization. I do have authorization on the website, so It's not a permission problem. I checked with other general managers, and they are having the same issue."}, {"id": "gp_9a7c7754-bbaf-4210-b8f5-40377ef0a2a9", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Konifesi Niuamoa", "title": "", "rating": 4, "date": "2022-02-12", "text": "Would be helpful to have a check list to go back to after you enter items, if you have to enter an item that you already entered at another area, it should alert you. As I'm learning the system, it's a good system but on the other hand it depends how the company wants us to use it according to their system."}, {"id": "gp_f95cba72-a690 ss scheduling"}, {"app": "Altametrics Schedules", "author": "Arnoldboehm", "date": "2018-05-21", "id": "ios_2576807594", "platform": "App Store", "rating": 5, "text": "Zip Schedule is very interactive and awesome application for employee scheduling. It is easy to use or we can say user friendly. I have recommend my friends too, to use the application for scheduling.", "title": "Interactive app in the market"}, {"app": "Altametrics Schedules", "author": "tomsellack", "date": "2018-05-19", "id": "ios_2569269600", "platform": "App Store", "rating": 5, "text": "This app does a lot more than the one we used to use. It’s easy and it’s free which is great.", "title": "Better than HotSchedules"}, {"app": "Altametrics Schedules", "author": "Solomonpankow", "date": "2018-05-17", "id": "ios_2559373517", "platform": "App Store", "rating": 5, "text": "This is a very useful app for the employee who is working in different organizations or at different stores within the same organization can view his/her shifts in zip schedules.", "title": "App for employees"}, {"app": "Altametrics Schedules", "author": "Casandrawhitted", "date": "2018-05-15", "id": "ios_2551861169", "platform": "App Store", "rating": 5, "text": "A very awful app through which we can create a schedule very easily.", "title": "Best Scheduling App"}, {"id": "gp_773b14d9-ec63-4be3-a6a6-e600b20af834", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "A Google user", "title": "", "rating": 4, "date": "2018-05-14", "text": "This app is giving great help to me during taking the inventory count. No paper, just use this ap for entry what you count in your store. Sync is also great, count from your mobile and can run reports from my iPad or PC. Thanks guys keep rocking."}, {"app": "Altametrics Schedules", "author": "Shantaypickle", "date": "2018-05-14", "id": "ios_2545742655", "platform": "App Store", "rating": 4, "text": "Our employees love receiving their work schedules through the Zip Schedules mobile app. It makes team communication easy which make everyone happy and saves a lot of time. Now, we are creating more accurate schedule in minutes while getting correct labor costs under control.", "title": "Excellent Scheduling App"}, {"app": "Altametrics Schedules", "author": "Dwightvince", "date": "2018-05-09", "id": "ios_2524695453", "platform": "App Store", "rating": 5, "text": "It's a great app with cool features. The best part of the application is that my managers can communicate with crew employees using the team center.", "title": "Great scheduling app"}, {"app": "Altametrics Schedules", "author": "scottieburse", "date": "2018-05-08", "id": "ios_2520555342", "platform": "App Store", "rating": 5, "text": "I absolutely love this app. It's very useful for our business. It helps all of my managers to see their employees schedule and phone number on their phones. They can easily see who is available and can approve shifts, availability changes etc.", "title": "App for business"}, {"app": "Altametrics Schedules", "author": "anthonygrahamm", "date": "2018-05-07", "id": "ios_2516195879", "platform": "App Store", "rating": 4, "text": "This is one of the great applications that I have ever used. The best part is that it's free of cost whereas some other applications from other companies charge money for this. This application has almost everything an employee needs to see their schedule and also can swap their shifts with others. I would give this application 4 stars.", "title": "Everything for employee needs"}, {"app": "Altametrics Schedules", "author": "rebeljohnson", "date": "2018-05-04", "id": "ios_2503520370", "platform": "App Store", "rating": 4, "text": "Easy to use app, makes life so much easier to see your schedule and edit in seconds.", "title": "Easy to use"}, {"id": "gp_18e83c0a-01e7-44e4-8f5c-e1a83fa1cddc", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "A Google user", "title": "", "rating": 5, "date": "2018-04-26", "text": "Nice UX"}, {"app": "Altametrics Schedules", "author": "genbolanos", "date": "2018-03-19", "id": "ios_2324307790", "platform": "App Store", "rating": 1, "text": "This is honestly the worst app for work and needs some serious improvements ! I’ve had 7shifts and HotSchedules which are awesome and better than this.\nWhat needs improving ?\n1. Notifications: this apps doesn’t notify when our schedules are out or when someone is giving away their shift. \n2. Contacts: for some reason, the contacts went away ??? Now we can’t see people’s contact information, which is needed when we need to get ahold of them. \n3. Messaging: we wouldn’t need contacts info if we could directly message in the app! Or even have a place where we could post messages like 7shifts! \n4. Work schedule: being able to see who is or isn’t working for the day would be helpful. That way we’re not wasting our time messaging people who are already working. \n5. Time off request: apparently at work we have to write down our time off request in a notebook because this app doesn’t let us request time off!! It disappears from the system once approved ??\nPlease ! Improve the app and make it useful to those who use it. There are so many changes that are needed. If I had the power to change what app we use I would.", "title": "Please improve"}, {"app": "Altametrics Schedules", "author": "LV Outback", "date": "2018-02-16", "id": "ios_2214115005", "platform": "App Store", "rating": 1, "text": "Hotschedules puts this scheduling app to shame and I am ashamed that you make Outback employees use this terrible app.", "title": "Cerca Trova.....you need help, scheduling, accounting and much more!"}, {"app": "Altametrics Schedules", "author": "TrvlBella", "date": "2018-02-04", "id": "ios_2165583360", "platform": "App Store", "rating": 1, "text": "It’s been months and we’re still forced to use this inefficient app with absolutely NO improvements so far. Whoever designed it and the one subjecting us to use it not only lack compassion, they might be downright evil. I never write app reviews but my frustration level has reached astronomical proportions!!!", "title": "Seriously? No improvements yet?!"}, {"app": "Altametrics Schedules", "author": "Timothy teej T", "date": "2018-01-09", "id": "ios_2072380859", "platform": "App Store", "rating": 1, "text": "Don’t expect to be able to do anything but see the day and time you work....maybe. The app is extremely buggy and non user friendly. It sometimes doesn’t even post some of my days. Altametrics is an absolute piece of crap.", "title": "Horrible options. Buggy"}, {"app": "Altametrics Schedules", "author": "ysidro00", "date": "2017-12-30", "id": "ios_2043100501", "platform": "App Store", "rating": 1, "text": "App is unorganized and dysfunctional, Needs a major overhaul. If I’m scheduled in the AM I can’t see if I’m schedule in the PM The only way to find out is to call my employer.", "title": "What is this..."}, {"app": "Altametrics Schedules", "author": "Kj6cea", "date": "2017-12-26", "id": "ios_2030032181", "platform": "App Store", "rating": 1, "text": "This application is missing a few things:\n*Ability to see your coworkers schedule\n*Ability to see ALL current staff and numbers if they chose to have a visible option. (Why is that even there because there's no staff list?)\n*Ability to swap shifts with ALL applicable staff ( staff scheduled for same shifts should be able to swap outside of availability and during scheduled shifts)\n*Ability to message staff AT ALL (REALLY?)\n\nHard to believe this is at all related to zip schedules....", "title": "Why do I even need this app"}, {"app": "Altametrics Schedules", "author": "The_Luruski", "date": "2017-12-20", "id": "ios_2013060176", "platform": "App Store", "rating": 1, "text": "This app is terrible! Not user friendly and is constantly glitchy. Wish they could see how a real workforce app works so they could mimic it at least.", "title": "Would give negative stars if I could"}, {"app": "Altametrics Schedules", "author": "Lisatruonggg", "date": "2017-11-29", "id": "ios_1959107961", "platform": "App Store", "rating": 1, "text": "Just terrible!", "title": "Terrible!!!"}, {"app": "Altametrics Schedules", "author": "Ayemannn", "date": "2017-11-14", "id": "ios_1921447594", "platform": "App Store", "rating": 1, "text": "There is nothing good to say about this app so far other than it needs a ton of work, and from being a previous user of HotSchedules for 7 years, having to switch to this really blows. Here are some requests and suggestions for the developers from an employees standpoint:\n1. This app is not user friendly- you cannot release or pickup shifts \n2. We have no way to see our other coworkers schedule! This by far is highly frustrating and inconvenient. How am I suppose to know wether or not I am the only one scheduled that day/night or who comes in before or after me. Knowing this is very important so employees can plan accordingly.\n3. We cannot message others directly through this application, and since we don't know who is or isn't working we virtually have no way to reach other employees for a quick shift cover if needed.\nThanks! Hope this review helps and this application receives the improvements it's needed QUICKLY.", "title": "Needs A TON of work"}, {"app": "Altametrics Schedules", "author": "mfranchs", "date": "2017-11-04", "id": "ios_1897575415", "platform": "App Store", "rating": 1, "text": "Disgustingly Awful", "title": "Awful"}, {"app": "Altametrics Schedules", "author": "Litte chica", "date": "2017-10-20", "id": "ios_1862323029", "platform": "App Store", "rating": 1, "text": "This is the absolute worst scheduling app out there. After using hotschedules for 8 years this doesn’t even begin to compare. Doesn’t list the section being worked, you can’t see anyone else’s schedule, requests don’t work so we had to switch to using a notebook calendar to request time off. The format is terrible! They should be paying the company to use the app rather than the other way around.", "title": "I wish I could give this app zero stars."}, {"app": "Altametrics Schedules", "author": "SRO2003", "date": "2017-10-16", "id": "ios_1854180131", "platform": "App Store", "rating": 1, "text": "Terrible app! Wouldn't use it if I wasn't forced to for work. Hotshcedules was 100 times better!", "title": "1 star"}, {"app": "Altametrics Schedules", "author": "Madidori_44", "date": "2017-10-11", "id": "ios_1842998682", "platform": "App Store", "rating": 1, "text": "I would rather go through the trouble of paper scheduling rather than use this app. If I could give it no stars for making work THAT much more difficult. Make this app user friendly or just get rid of it completely, it does more harm than it does help.", "title": "This app is absolutely terrible"}, {"app": "Altametrics Schedules", "author": "Anthony from Guam", "date": "2017-10-08", "id": "ios_1835968265", "platform": "App Store", "rating": 2, "text": "Coming from Hot Schedules... One feature needed is the ability to see who I’m working with.", "title": "Needs Improvement"}, {"app": "Altametrics Schedules", "author": "madoutbacker", "date": "2017-10-05", "id": "ios_1830164679", "platform": "App Store", "rating": 1, "text": "This app is awful, and it doesn't let you see your coworkers schedules. Half of the time, I can barely see my own schedule. This app needs A TON of improvement. I wish I could go back to HotSchedules.", "title": "Terrible"}, {"app": "Altametrics Schedules", "author": "NikkiD1016", "date": "2017-09-18", "id": "ios_1797671601", "platform": "App Store", "rating": 1, "text": "I normally don't write reviews but this app is beyond frustrating. This app could probably have great potential but it is lacking in so many areas. You can't see anyone's schedules but your own. There's no way to get shifts covered or swap unless you text/call everyone and bother them. And that's if you have all your coworkers info in the first place. And when messages are sent out through the app they aren't reaching everyone. There's no way to show double shifts or when you're on a double shift with two different job codes. It hasn't even been a week and I miss HotSchedules.", "title": "More like NotSchedules"}, {"app": "Altametrics Schedules", "author": "Your boy, blue", "date": "2017-09-11", "id": "ios_1786000653", "platform": "App Store", "rating": 1, "text": "Hi! I just wanted to say that it is greatly inconvenient to have no access to co-workers via in app-scheduling, which is something my previous app allowed me to do. This is causing an abrupt left turn, in terms of fluidity. I think that it's important to have open communications that allow me to interact with individuals whom I actively see and conduct daily business with on a regular basis, this includes;\n•Ability to see what days I'm working and who I'm working with. \n•Ability to swap and pickup shifts with and from other employees.\nThese issues are really basic, but can still be really easily over looked! However, If things like this are left unaddressed, then they'll never continue to as is a simplicities error, which is annoying at most, resolves then to fester . Just my two cents, thank you for your time. :)", "title": "Read me!!"}]};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => d.toISOString().slice(0,10);
const fromEl = document.getElementById("from"), toEl = document.getElementById("to"), platEl = document.getElementById("platform");

document.getElementById("title").textContent = `Reviews Dashboard: ${DATA.company} (${DATA.app})`;
document.getElementById("generated").textContent = "Last sync: " + new Date(DATA.generated).toLocaleString();

const appEl = document.getElementById("app");
const keyOf = r => r.app ? `${r.platform} · ${r.app}` : r.platform;
const tileKeys = [...new Set([...Object.keys(DATA.status), ...DATA.reviews.map(keyOf)])].sort();
const fill = (el, vals) => vals.forEach(v => el.insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`));
fill(platEl, [...new Set(DATA.reviews.map(r => r.platform).concat(tileKeys.map(k => k.split(" · ")[0])))].sort());
fill(appEl, [...new Set(DATA.reviews.map(r => r.app).concat(tileKeys.filter(k => k.includes(" · ")).map(k => k.split(" · ")[1])))].filter(Boolean).sort());

function setPreset(days){
  const today = new Date();
  toEl.value = iso(today);
  fromEl.value = days ? iso(new Date(today - days*864e5)) : "";
}

function render(){
  const from = fromEl.value || "0000", to = toEl.value || "9999", plat = platEl.value, app = appEl.value;
  const list = DATA.reviews.filter(r => r.date >= from && r.date <= to && (!plat || r.platform === plat) && (!app || r.app === app));

  document.getElementById("tiles").innerHTML = tileKeys.filter(k => {
    const [kp, ka] = k.split(" · ");
    return (!plat || kp === plat) && (!app || ka === app);
  }).map(p => {
    const st = DATA.status[p] || {}, rs = list.filter(r => keyOf(r) === p);
    const avg = rs.length ? (rs.reduce((a,r) => a + Number(r.rating||0), 0) / rs.length).toFixed(2) : "–";
    const sum = st.summary || {};
    const overall = sum.rating ? `Store rating ${sum.rating}${sum.total_ratings ? " · " + Number(sum.total_ratings).toLocaleString() + " ratings" : ""}` : "";
    const health = st.ok === false
      ? `<div class="small bad">FAILED: ${esc(st.error)}</div>`
      : `<div class="small ok">${st.source === "manual" ? "Manual CSV" : "Auto"} · ${st.last_success ? new Date(st.last_success).toLocaleDateString() : ""}</div>`;
    return `<div class="tile"><div class="name">${esc(p)}</div><div class="v">${rs.length}</div>
      <div class="small muted">reviews in range · avg ${avg}</div><div class="small muted">${esc(overall)}</div>${health}</div>`;
  }).join("");

  document.getElementById("count").textContent = `${list.length} reviews`;
  document.getElementById("rows").innerHTML = list.slice(0, 1000).map(r => `<tr>
    <td>${esc(r.date)}</td><td>${esc(r.platform)}</td><td>${esc(r.app)}</td>
    <td class="stars">${"★".repeat(Math.round(r.rating||0))}${"☆".repeat(5-Math.round(r.rating||0))}</td>
    <td>${esc(r.author)}</td><td>${r.title ? "<b>"+esc(r.title)+"</b><br>" : ""}${esc(r.text)}</td></tr>`).join("");
}

document.querySelectorAll(".btn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".btn").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); setPreset(Number(b.dataset.days)); render();
});
[fromEl, toEl].forEach(el => el.onchange = () => { document.querySelectorAll(".btn").forEach(x => x.classList.remove("active")); render(); });
platEl.onchange = render; appEl.onchange = render;
setPreset(30); render();
</script>
</body>
