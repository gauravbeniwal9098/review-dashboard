ough understanding. ChitChat adds a personal touch to team communication. | Cons: Delete chat feature is not available in the chitchat."}, {"id": "m_be086e31c5c74728", "platform": "Software Advice", "app": "", "author": "Hari G.", "title": "Efficient Punch Management!", "rating": 5.0, "date": "2024-02-29", "text": "Pros: This app simplifies punch management for managers. Real-time labor alerts and the ability to view Clocked In employees are great features. | Cons: There's room for improvement in the user interface"}, {"id": "m_e9dd9ef563c02a68", "platform": "Software Advice", "app": "", "author": "Troy P.", "title": "Managerial Hub of Control!", "rating": 5.0, "date": "2024-02-29", "text": "Pros: This app provides vital insights for managers making business decisions. Real-time KPI tracking and store-wise ranking are commendable.The Daily Activity Report's detailed time data is beneficial.Display settings customization adds control. | Cons: Some improvements in user guidance are needed."}, {"id": "ios_10987793447", "platform": "App Store", "app": "Altametrics Schedules", "author": "Bloodshot93", "title": "Crashing", "rating": 1, "date": "2024-02-27", "text": "This app doesn’t work I can’t pick up any shift it keep crashing on me phone and tablet"}, {"id": "m_3f92507826be1265", "platform": "Software Advice", "app": "", "author": "James M.", "title": "All-in-one scheduling brilliance!", "rating": 4.0, "date": "2024-02-27", "text": "Pros: This app has made scheduling a breeze for our team. The approval processes are quick, and the communication tools are fantastic. Highly recommend! | Cons: There is little slowness in the web application on some pages which we reported and business relationship manager were courteous enough to listen and bring in changes on next release cycle."}, {"id": "gp_882d7688-5064-48e6-a537-73cf3213a372", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Tennille Rogers", "title": "", "rating": 1, "date": "2024-02-26", " none of my department managers including myself can access the days requested off by our crew. please look into it!!"}, {"id": "ios_10303212695", "platform": "App Store", "app": "Altametrics Clock", "author": "rando9870", "title": "App crashes", "rating": 1, "date": "2023-08-26", "text": "Just as the title says the app crashes every time I click either “on clock” or “on break”."}, {"id": "ios_10283046607", "platform": "App Store", "app": "Altametrics Schedules", "author": "Melissa830", "title": "Has a lot of bugs. Needs work.", "rating": 3, "date": "2023-08-21", "text": "It’s okay. But, the chat chat option doesn’t work for me. Notifications are on, but chit chat says to log out and back in. I did that and still doesn’t work."}, {"id": "gp_5f7d752b-c53e-449c-bded-7fa51f58960c", "platform": "Google Play", "app": "Altametrics DAR", "author": "Joshua Murphy", "title": "", "rating": 3, "date": "2023-08-18", "text": "Ever since update the biometric option has disappeared. Putting a password in every time is inconvenient and will deter me from using this app any longer. Make things easier not more complicated."}, {"id": "ios_10274714700", "platform": "App Store", "app": "Altametrics Schedules", "author": "bob ur job", "title": "b word", "rating": 1, "date": "2023-08-18", "text": "nick ger"}, {"id": "ios_10269129781", "platform": "App Store", "app": "Altametrics Clock", "author": "Angel RU", "title": "Keep logging off", "rating": 1, "date": "2023-08-17", "text": "The app crashes after I click on clock."}, {"id": "ios_10269962933", "platform": "App Store", "app": "Altametrics Schedules", "author": "Leo halliwell", "title": "Needs some fixing", "rating": 1, "date": "2023-08-17", "text": "App keeps crushing"}, {"id": "gp_4b264d94-acaa-4a0d-88a4-f23e8b756c7e", "platform": "Google Play", "app": "Altametrics DAR", "author": "Teri Sanders", "title": "", "rating": 2, "date": "2023-08-13", "text": "Slows me down due to have to log on every time I check it"}, {"id": "gp_26871292-206  time to fix this. It is not my phone (I've had several) and it is across service providers. Fix this issue. I only gave the 2 stars I did because when it works its great. Now make it work, please."}, {"id": "gp_409ce5df-aad1-4b57-a3c7-5891dd05d806", "platform": "Google Play", "app": "Altametrics DAR", "author": "Kenny Tulloch", "title": "", "rating": 2, "date": "2023-07-20", "text": "I'm an shift manager and I have tried logging in and I get an messages saying I'm not an authorized to access to this application. Please contact altametrics support. How is I had one Manger get in last night and I can't. Can't use the tools to help us in a shift if we don't have access. Please some look into and fix the problem. Thank you. Kenny"}, {"id": "gp_4e21bccc-a11c-4d47-bce4-ff3ae91ae649", "platform": "Google Play", "app": "Altametrics DAR", "author": "Xavier Manuel Flores chavez", "title": "", "rating": 2, "date": "2023-07-19", "text": "I'm just like April down there or up there... The app lets me creat username and password but I have no access.?"}, {"id": "gp_23afc17e-1187-466a-ad94-2c77db3745de", "platform": "Google Play", "app": "Altametrics Clock", "author": "Laine Wellington", "title": "", "rating": 1, "date": "2023-07-03", "text": "App repeatedly crashes when trying to view currently on clock / currently on break"}, {"id": "ios_10093603934", "platform": "App Store", "app": "Altametrics Clock", "author": "Hate jagbani", "title": "Doesnt work", "rating": 1, "date": "2023-07-01", "text": "All this app say is YOUR SESSION HAS BEEN TIMED OUT, LOG IN AGAIN."}, {"id": "ios_10080437538", "platform": "App Store", "app": "Altametrics Schedules", "author": "Cam ⁉️👌", "title": "Laggy and bad", "rating": 3, "date": "2023-06-27", "text": "I hate how laggy this app is and how often it breaks, its shut down multiple times and i’ve gotten in trouble for it being down or telling me incorrect shifts. You can’t see who you’re scheduled with either, which blows. Overall too glitchy and hard to function."}, {"id": "gp_e8b30295-b366-4fa1-b035-54571eeb261c", "platform": "Google Play", "app": "Altametrics Clock", "author": "Ariana Solis", "title": "", "rating": 1, "date": "2023-06-20", "text": "I love my new phone, i switched from Iphone to Samsung because i really like the Samsung Fold. However, I am having ALOT of issues using this app on my phone and i can see i am not the only one now. This app worked perfectly fine with Apple, I need this app for work (I use all Altametric) so if this issue cannot be resolved i am considering switching back to Iphone."}, {"id": "ios_10012606803", "platform": "App Store", "app": "Altametrics Schedules", "author": "Geirokku", "title": "Can’t get in to see schedules", "rating": 1, "date": "2023-06-08", "text": "Since I’ve started work I haven’t been able to get past the screen that asks for my timecard or employee ID. I’ve spoken to multiple of my managers about this, and my gm even tried to get in to my scheduling herself, but we were still unable to get through. \nIt always says “configure the application” no matter if what we put in is correct or not. I’m unsure if this is just a bug or not but it has done this on three of my different phones and my gm said she’s never encountered something like that before me. \nAnd so any time I need to request a day off, I have to tell her in person (which can be hard, considering we work different shifts).\nAny help with this issue would be appreciated."}, {"id": "ios_9987214443", "platform": "App Store", "app": "Altametrics Schedules", "author": "Haleigh2210473", "title": "Horrible", "rating": 1, "date": "2023-06-01", "text": "0/10!!\n\nNever works\nAlways logging you out\nNever sends a recovery email or text or call\nHalf the time doesn’t work \nHorrible to use!"}, {"id": "ios_9989668517", "platform": "App Store", "app": "Altametrics Schedules", "author": "dani.ann*", "title": "Went Wrong", "rating": 2, "date": "2023-06-01", "text": "I used to use this app all the time and it was perfect. About 2ish weeks ago it stopped working. I went to open it and it wouldn’t accept my password, which I knew was correct. I went to reset the password and I can’t get past the part when you’re sent the security code. It gets sent to my email, but when it is supposed to go to my phone I never get it. I’m not sure if this is just a glitch created by an update or what. Please fix this!"}, {"id": "ios_9970812375", "platform": "App Store", "app": "Altametrics Schedules", "author": "Coopy-Fig", "title": "Cant even get past the login.", "rating": 1, "date": "2023-05-27", "text": "I have been waiting for a week for my “request to be submitted”. This app won’t even let me get past the login page to view the schedule at my new job and everyone I talked to there says even when they get in it’s one of the worst apps to ever use. From what I’ve seen it crashes constantly, is slow, and half the time the schedules are just wrong, no clue why, they just change the schedule on us. Still would be nice to even GET PAST THE LOGIN."}, {"id": "ios_9963636008", "platform": "App Store", "app": "Altametrics DAR", "author": "Afarefeleefi", "title": "Update issue", "rating": 4, "date": "2023-05-25", "text": "Great app to have to check on my store when I’m not there or just to pull up real quick.. but the app seemed to have an issue when the update went thru, took me a while but I finally thought about restarting my phone and it has been working since."}, {"id": "gp_1a711ab5-19cc-4108-ae39-d4814d0f3463", "platform": "Google Play", "app": "Altametrics Clock", "author": "Abbie Harris", "title": "", "rating": 1, "date": "2023-05-22", "text": "Doesn't even send a code to log in. The app completely stopped working"}, {"id": "gp_36c6241a-dab9-4bf1-8f54-721127e68427", "platform": "Google Play", "app": "Altametrics Clock", "author": "Jo", "title": "", "rating": 1, "date": "2023-05-22", "text": "Service appears to be shut down."}, {"id": "ios_9953426314", "platform": "App Store", "app": "Altametrics Schedules", "author": "Carson Ram", "title": "Customer Service", "rating": 1, "date": "2023-05-22", "text": "I used to be able to get into my account and the app was working great until one day it logs me out and I can’t log back in. I try to get the verification code to my email and to my phone and it never sends to me. I therefore rate it 1 star because I need to get into my account to see when I work but I am unable to get in and the customer service does not help because I already sent 5-6 messages so I can get back my account and not a single one was responded to. Fix this problem."}, {"id": "ios_9954841979", "platform": "App Store", "app": "Altametrics Schedules", "author": "chee_(3", "title": "Good But some bad things", "rating": 1, "date": "2023-05-22", "text": "The app overall is good, but recently the app shut down which made me unable to view my work schedule.\n\nSo I tried to reset my password and now I am unable to log back in even with phone number or email.\n\nThey said they sent verification code but they won't show up and now I can't even access the login anymore with out the password reset screen popping up in stead of the regular long in."}, {"id": "ios_9955060647", "platform": "App Store", "app": "Altametrics Schedules", "author": "Magneato👌🏻👌🏻", "title": "Horrible, slow, and always crashes", "rating": 1, "date": "2023-05-22", "text": "I work at McDonald’s and I have to use this app. I can’t request off because no one knows how to even look for the time off requests of this app anymore, I can’t look at my schedule without it bugging out, and now it’s booted me off and won’t let me back in. It says it’s sending some code to my email but it never does. Unbelievable. \nI wish my job didn’t have to have this but it’s quite literally the only way to see my schedule. Fix your app and do better"}, {"id": "ios_9955092085", "platform": "App Store", "app": "Altametrics Schedules", "author": "Tomas James Moffett", "title": "No support", "rating": 1, "date": "2023-05-22", "text": "Never received a activation code ever"}, {"id": "ios_9955198158", "platform": "App Store", "app": "Altametrics Schedules", "author": "Daltontravelstead1", "title": "Not work", "rating": 1, "date": "2023-05-22", "text": "I never get a code to active my account it was working a month ago signed me out now I can’t get my schedule"}, {"id": "ios_9955791628", "platform": "App Store", "app": "Altametrics Schedules", "author": "sndbdbdbbdd", "title": "Can’t get in", "rating": 1, "date": "2023-05-22", "text": "It won’t let me log in"}, {"id": "gp_10123dbd-93ac-40f3-8170-d87183cf136a", "platform": "Google Play", "app": "Altametrics DAR", "author": "Mandy Leibovitz", "title": "", "rating": 1, "date": "2023-05-21", "text": "Use to work great but the last 2 days hasn't worked at all. It just keeps saying service unavailable at this time."}, {"id": "gp_437981ae-3d4f-43ec-b36e-8ae72392ef0f", "platform": "Google Play", "app": "Altametrics Clock", "author": "skyarc60", "title": "", "rating": 1, "date": "2023-05-21", "text": "First it was the \"schedule\" version that stopped working properly and it's this one. What the actual f***."}, {"id": "gp_8c6fb26f-12be-432c-88b2-776d08283988", "platform": "Google Play", "app": "Altametrics Clock", "author": "Fatima Jimenez", "title": "", "rating": 1, "date": "2023-05-21", "text": "The app isn't working for me. When I put to login, it won't give me my code. I tried to uninstall the app and install it again, but nothing, so now I can't see my schedule."}, {"id": "gp_d7e0aa7c-68ad-412e-b3b9-81809d7f3cc4", "platform": "Google Play", "app": "Altametrics Clock", "author": "Tabitha Gale", "title": "", "rating": 1, "date": "2023-05-21", "text": "Won't let me in to check stuff and then won't send codes to create a new password."}, {"id": "ios_9950840404", "platform": "App Store", "app": "Altametrics DAR", "author": "Guiller GS7", "title": "It was really good until last update", "rating": 3, "date": "2023-05-21", "text": "It looks this app is always suffering after apple release a new update, after the last update couple days ago I’m unable to open the app and I tried everything!!!"}, {"id": "ios_9951089394", "platform": "App Store", "app": "Altametrics Clock", "author": "Axls Nelvin", "title": "Awesome app.", "rating": 4, "date": "2023-05-21", "text": "Awesome app. But It doesn't work. It Doesn't send any code it's need an update now."}, {"id": "ios_9951618370", "platform": "App Store", "app": "Altametrics Schedules", "author": "the vibess😂", "title": "Verification code", "rating": 1, "date": "2023-05-21", "text": "I tried to look at my schedule yesterday and there was an error logging me in, so I logged out. When I tried to log back in and send a verification code I never got one. So I tried again and again. I’ve been trying for hours and it still doesn’t work. This app is annoying and makes me frustrated. Fix it now because I don’t know my schedule anymore."}, {"id": "ios_9951817402", "platform": "App Store", "app": "Altametrics Schedules", "author": "Jeanette_demere", "title": "Terrible App", "rating": 1, "date": "2023-05-21", "text": "It won’t let me log back in with my email and every time it says it’s sending me a verification code it doesn’t show up in my inbox."}, {"id": "ios_9952227645", "platform": "App Store", "app": "Altametrics Schedules", "author": "DaisyNaisy", "title": "Stick with paper schedule", "rating": 1, "date": "2023-05-21", "text": "My job uses this for our scheduling. This is my first time ever using this app and even hearing about it. So basically it never really works. I can’t see my schedule all the time. This is highly inconvenient for anyone. The paper schedules is a mess so I thought how great would it be to use this app and see everything. You can only see your schedule on for that week. You really can’t see it for the whole entire month or even for the next week. I don’t like this app at all. I really wish our company would find another app for scheduling. This is not it. The constant updates are useless if it’s constantly not working. I prefer to just go old school and get a paper copy and call it day."}, {"id": "ios_9952435414", "platform": "App Store", "app": "Altametrics DAR", "author": "Aquaman4ever", "title": "Great when it works", "rating": 1, "date": "2023-05-21", "text": "All weekend all the Altametrics apps are broken. \nWith a business to run this used to be helpful to control labor and check our sales and transactions.  Please fix it.  Not to long ago it was down for a month I hope you can get it together sooner this time.  So when it works it’s wonderful."}, {"id": "ios_9946389399", "platform": "App Store", "app": "Altametrics Schedules", "author": "MOAmuse", "title": "Multiple issues and questions", "rating": 1, "date": "2023-05-20", "text": "I don’t know how else to contact you guys so I’ll just go through reviews. I can’t seem to get any verification code sent my way which is weird because it used to work just fine. Now I don’t know my schedule. Also I was wondering if the same email or phone number could be used across multiple scheduling accounts or if I’d need to have that changed? I tried looking it up but didn’t find anything so now I feel lost. Now when I try to open the app it won’t even load the home screen."}, {"id": "ios_9946590164", "platform": "App Store", "app": "Altametrics Schedules", "author": "parryjr", "title": "Needs work… like a lot of work.", "rating": 2, "date": "2023-05-20", "text": "The app randomly logs you out, then requires activation codes to let you log back on. It never sends you any codes and so you’re not able to get into the app. Make that make sense,"}, {"id": "ios_9947756577", "platform": "App Store", "app": "Altametrics Schedules", "author": "Snowflakenewbie", "title": "Help!", "rating": 2, "date": "2023-05-20", "text": "I’ve been having trouble with your app all day so I decided to delete and redownload to see if it would work and force restarting my phone but after I redownloaded the app it won’t give me the verification on my email, phone, or text so I can’t login into my schedule and I need to know my schedule! What happened before I deleted and redownloaded was that it was an error of maintenance checking or whatever and would let me login with my password or face which led me to redownloading it after deleting it"}, {"id": "ios_9948902830", "platform": "App Store", "app": "Altametrics Schedules", "author": "pikbow", "title": "Arggg", "rating": 1, "date": "2023-05-20", "text": "I am freaking out because this is the only way I can see my schedule for work and I have tried everything and the app is not letting me login or give me the information to login like the codes."}, {"id": "ios_9949156799", "platform": "App Store", "app": "Altametrics Schedules", "author": "Dahmenez", "title": "Issues", "rating": 1, "date": "2023-05-20", "text": "The app was good at first, but then all of a sudden it signed me out then it told me to reset my password, and keeps asking for my email or phone number to activate it but won’t send me the code no matter how I much I click resend, now I don’t even know when I gotta be to work tomorrow."}, {"id": "ios_9949176347", "platform": "App Store", "app": "Altametrics Schedules", "author": "Johnnyblah1992", "title": "Horrible", "rating": 1, "date": "2023-05-20", "text": "This app is horrible it has so many bugs and needs a lot of work! It logs me out all the time it doesn’t show the correct hours I’ve worked ! I don’t know why companies use this app it’s good for nothing !!!"}, {"id": "ios_9945586382", "platform": "App Store", "app": "Altametrics Schedules", "author": "Moth_Man_3000", "title": "Almost always down for maintenance", "rating": 1, "date": "2023-05-19", "text": "App has been “down for maintenance” all day. Not sure what kind of maintenance takes all day for an app whose problems are never fixed or it this is just a glitch but it happens way too often for me and my coworkers. It gets really annoying when the one job the app has is to show you your schedule and it can’t even do that half the time because it won’t even let you log in to see it."}, {"id": "gp_647216ac-79ff-4427-a2b3-570da46d4939", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Ali Niblett", "title": "", "rating": 5, "date": "2023-05-14", "text": "Makes doing inventory so much easier and less time consuming"}, {"id": "ios_9888690879", "platform": "App Store", "app": "Altametrics Schedules", "author": "KyBBN", "title": "Slowwwww", "rating": 1, "date": "2023-05-03", "text": "This app is so slow. Always has been and continually gets worse. We were paying for another vendor to pull the schedules from Altametrics but it wasn’t being highly utilized so went back to this app. It takes in excess of a minute to load messages. And that’s if it even loads at all."}, {"id": "ios_9858594647", "platform": "App Store", "app": "Altametrics Clock", "author": "heavenly1111", "title": "Terrible App", "rating": 1, "date": "2023-04-24", "text": "Such a waste of an app. Doesn’t even work! 👎🏽🙄"}, {"id": "gp_16ab9fab-17e7-4a10-91ee-a2eb73dd09dd", "platform": "Google Play", "app": "Altametrics Clock", "author": "Joni Meyer", "title": "", "rating": 1, "date": "2023-04-16", "text": "Everytime you click to see who is on the clock, the whole app crashes and reboots. Never let's me see who is clocked in. So disappointing."}, {"id": "ios_9830193686", "platform": "App Store", "app": "Altametrics Schedules", "author": "MightyRufo", "title": "A swing.. and a miss…", "rating": 2, "date": "2023-04-16", "text": "No integration with Apple Calander? What about the fact that “today” doesn’t change when opening the app after opening it previously from a different day, yet it still takes 5 seconds for it to “refresh”. Random sms code requests which disappear after closing and reopening the app? Multiple password for internal and external access? Why? No widget support either!? How about integration with third party calendars? External access to email? Apple Mail client support? The only reason I use it, is because I have to."}, {"id": "ios_9814936168", "platform": "App Store", "app": "Altametrics Schedules", "author": "MyLifeSuckz", "title": "Doesn’t let you access", "rating": 4, "date": "2023-04-12", "text": "You all really need to work on your app.  90% of the time I try to get on to check and see who is on my clock or to see who’s late or hasn’t showed up it tells me I have been logged out and need to log back in.  The schedule and clock are the only ones to do this.  Fix the problem"}, {"id": "ios_9799957457", "platform": "App Store", "app": "Altametrics Clock", "author": "JRCOMPTON4", "title": "Break and Lunch Suggestions", "rating": 3, "date": "2023-04-08", "text": "I would love to see a feature for break and lunch suggestions. Where I could go and it would tell me who is next in line for a break and lunch. Sometimes it’s hard to figure out where everyone is at with their breaks. I know the alert feature is there but shouldn’t the idea be to avoid getting to the point of alerts."}, {"id": "ios_9801818203", "platform": "App Store", "app": "Altametrics Schedules", "author": "@lon3rsparadise", "title": ".", "rating": 1, "date": "2023-04-08", "text": "this app is sum dookie"}, {"id": "gp_d8c22558-55f2-4c67-b1b7-9c422cebce1d", "platform": "Google Play", "app": "Altametrics DAR", "author": "sherrie Barfield (sherriebarfield)", "title": "", "rating": 1, "date": "2023-03-26", "text": "My rankings dashboard will not come up I have unistalled and reinstalled and still won't work and I'm supposed to use this at my job."}, {"id": "ios_9747867996", "platform": "App Store", "app": "Altametrics Schedules", "author": "something...........", "title": "This app is so bad employees refuse to use it", "rating": 1, "date": "2023-03-24", "text": "The place I work at uses this app it takes ten years to load if you have an older device and even then with a newer device some features take forever to load.  It honestly prevents people from checking the app and picking up shifts"}, {"id": "gp_32b070f4-6049-43c3-955e-ca76fda05143", "platform": "Google Play", "app": "Altametrics DAR", "author": "Unkown It solutions", "title": "", "rating": 5, "date": "2023-03-23", "text": "Great app"}, {"id": "gp_cce5cc1d-4989-466d-8eba-6f7772543b94", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Silvia Ornelas", "title": "", "rating": 5, "date": "2023-03-19", "text": "Wandefo"}, {"id": "ios_9717757528", "platform": "App Store", "app": "Altametrics Schedules", "author": "Blueranger410", "title": "Annoying", "rating": 1, "date": "2023-03-15", "text": "I find that the features of the app work but I continually have to redownload the app to fix an issue where the app begins to open, turns translucent, and disappears."}, {"id": "gp_0e4ccef1-87fa-44e6-927c-72fda05c7c5a", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Martha Rodriguez", "title": "", "rating": 5, "date": "2023-03-03", "text": "Is good"}, {"id": "ios_9677050584", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Mr. CSC", "title": "Impossible to set up an account.", "rating": 1, "date": "2023-03-03", "text": "Just puts me into an infinite loop of inserting my personal/store information and then requesting the information I JUST PUT INTO IT and having me start over. Tried several times and gave up."}, {"id": "gp_01953701-dad1-4c60-b8db-1f5cf7a5b823", "platform": "Google Play", "app": "Altametrics Clock", "author": "Stephanie Brown", "title": "", "rating": 1, "date": "2023-02-10", "text": "Everytime I click on a shift the whole app closes. This could be a very good app to monitor break violations but the dang thing won't stay open."}, {"id": "ios_9550186448", "platform": "App Store", "app": "Altametrics Schedules", "author": "jsnsnsssmmsakaiqkwyyyyyy", "title": "Won’t load", "rating": 1, "date": "2023-01-26", "text": "I keep opening the app and it stays on the blue circle I’ve restarted my phone, I’ve deleted the app and still it keeps doing it, I’m just trying to check my schedule."}, {"id": "gp_7e188ad3-4006-46e5-839a-3c0ef06fb7bf", "platform": "Google Play", "app": "Altametrics Clock", "author": "James Cottrill", "title": "", "rating": 1, "date": "2023-01-24", "text": "Any time you see who's clocked in, the app just force quits. It's been doing for months on all my employees devices"}, {"id": "ios_9530345685", "platform": "App Store", "app": "Altametrics DAR", "author": "Guzel7", "title": "App doesn’t open !", "rating": 1, "date": "2023-01-20", "text": "Fix it I’m a manager and I can’t use this app always I try to open it crush and don’t let me open it!!!"}, {"id": "ios_9508430709", "platform": "App Store", "app": "Altametrics Schedules", "author": "Johnny blaze zero", "title": "Needs more work", "rating": 3, "date": "2023-01-14", "text": "The app is to bad just better data tracking and faster loading screens"}, {"id": "gp_5ace458d-c0b1-48cc-b6d0-8eb2341494eb", "platform": "Google Play", "app": "Altametrics Clock", "author": "Joshua Poole", "title": "", "rating": 1, "date": "2022-12-27", "text": "All this app does is force close if you try to see who's on the clock, which is what it for?!?!? I've noticed all the altametrics apps just force close regularly. I wish my company would find a a new option. Absolutely a waste of space ony phone."}, {"id": "ios_9433761482", "platform": "App Store", "app": "Altametrics Schedules", "author": "parkerizme", "title": "Unstable and holiday ruin", "rating": 2, "date": "2022-12-25", "text": "Site(s) not configured for applications.. your app cant app its app?"}, {"id": "gp_cffac46b-53df-4065-b6ad-44bdb1d0852a", "platform": "Google Play", "app": "Altametrics Clock", "author": "David Caine", "title": "", "rating": 1, "date": "2022-12-23", "text": "Horrible! Constantly crashes! Ya can't get a damn thing done with this app!!"}, {"id": "gp_a84a9c18- 0e65c", "platform": "Google Play", "app": "Altametrics Clock", "author": "Chris Hamilton", "title": "", "rating": 1, "date": "2022-11-28", "text": "Crashes all the time after I open cmon can't you guys fix android samsung s22 ultra"}, {"id": "ios_9338880159", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "hdndkrpane😂😂😂", "title": "Review", "rating": 3, "date": "2022-11-28", "text": "I want to give a lower review based on 2 things first being the load time why does it load so slow? Also when you search why does it search the whole inventory instead of the area you are already in which causes you to save every single time? This app is ok and easy to use. Altametrics is supposed to be a more up to date system but is slower and way more steps to get the same goal accomplished."}, {"id": "gp_53ab417a-37c9-4672-a6dd-675000bbb06e", "platform": "Google Play", "app": "Altametrics Clock", "author": "R. Jones", "title": "", "rating": 1, "date": "2022-11-26", "text": "App keeps crashing while operating thru it"}, {"id": "gp_6e3433af-eeaf-4d1f-be94-1400bc1c8c66", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "L CUHYAEUHL BUHRUHD", "title": "", "rating": 1, "date": "2022-11-25", "text": "logging elephant notified"}, {"id": "ios_9323910759", "platform": "App Store", "app": "Altametrics DAR", "author": "Calivin858", "title": "Disappointed", "rating": 2, "date": "2022-11-24", "text": "When I was introduced to this program I was very excited as the videos seemed to depict an easier and updated system to monitor the work place. As time went on I noticed that there is key features missing for example integration with floor plan, table orders with details even if open at the time, server sales and performance (a average sales per guest, Average sale on tables, voids, comps and promos along with details to who they pertain to) though the website does contain these,Its difficult to manage a location and having to constantly look at multiple apps (that don’t contain everything) or needing to be sitting in front of a computer to get all the information.  The new “update” now does not show labor percentage. so the example picture on this app info no longer is true. Labor is definitely one of the most important features in order to maximize net sales (surprisingly many locations agree). I’m now starting to miss the ancient PULSE app that had everything in one app. I would definitely give up the updated platform and go with an outdated platform that will give you everything in one app and more details on their desktop program. The suggested scheduling or ordering takes over a month to get into rhythm so it will creat a cost PNL. Please fix these these or add these features. I knwit the company I work for trialed this program for close to a year and still seems to be missing things. This program might be intended for work places but maybe not the service industry. Sorry to write this but hopefully you improve this program to the actual  potential it can be."}, {"id": "gp_95a855e9-3888-46ff-9c2c-819322e6aab0", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Darcey Ashton", "title": "", "rating": 3, "date": "2022-11-23", "text": "Doesn't work most of the time, but when it does it's great"}, {"id": "gp_3371c289-4998-40c5-81c6-9f389a9dc190", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Garret Walton", "title": "", "rating": 1, "date": "2022-11-17", "text": "If you do manage to complete an inventory before it just decides to delete everything, it will only actually post it half of the time. Please let me know when you develop a functional app."}, {"id": "gp_dd36301b-3d48-473c-bf58-aca47f80f5ad", "platform": "Google Play", "app": "Altametrics DAR", "author": "Garret Walton", "title": "", "rating": 1, "date": "2022-11-17", "text": "I would give it at least two stars if it even worked. What sucks is that I'm required at work to use it."}, {"id": "ios_9292986 ot working", "rating": 2, "date": "2022-04-12", "text": "I don’t know what’s going on but the app has stopped working. I tried on my iPad Pro and iPhone and it don’t work! Please fix this!!!"}, {"id": "gp_85689f3d-702b-4e25-bfe9-a008489ce2d6", "platform": "Google Play", "app": "Altametrics DAR", "author": "ZakMan1421", "title": "", "rating": 1, "date": "2022-04-10", "text": "I made an account and now every time I try to login, it says I'm unauthorized. Then, whenever I try to contact support through the app, I just get an error saying I can't. So pretty much I'm just locked out of the app for no reason at all."}, {"id": "ios_8511488491", "platform": "App Store", "app": "Altametrics Schedules", "author": "nintendoswitchuser", "title": "code", "rating": 2, "date": "2022-03-30", "text": "The app is not letting me login and view my schedule for work. Whenever I try to login it wants me to enter a code but it’s not letting me even though I already have an account for this app. The code didn’t expire and just got the code. Explanation, now"}, {"id": "gp_6e55c391-32b3-4742-8e67-a073afc056e0", "platform": "Google Play", "app": "Altametrics DAR", "author": "Nerdz Hype", "title": "", "rating": 1, "date": "2022-03-20", "text": "Downloaded for work purposes. Can't access the app because \"I'm not authorized\" and no one in my co-op can figure out why."}, {"id": "gp_f262f80b-dfae-4edf-918d-d6befb37eb45", "platform": "Google Play", "app": "Altametrics Clock", "author": "Carlos Garcilazo", "title": "", "rating": 2, "date": "2022-03-15", "text": "Great until recently. Until about a month ago the app worked well, I was able to do what I needed to do with the app. Now as a supervisor I cannot edit or even view my managers and floor supervisors. I have access on our website but the app doesn't want to allow access now. I have contacted support and submitted feedback about 3 weeks ago now and I still have not gotten a response. Wanted to avoid a bad review and give them a chance to help fix 1st."}, {"id": "ios_8425526376", "platform": "App Store", "app": "Altametrics Schedules", "author": "MajoraLink", "title": "Unbelievably painful to use.", "rating": 1, "date": "2022-03-05", "text": "I work for McDonald’s and, at our location, this is the app we use to manage schedules, messaging crew mates, requesting time off, etc. I’ve been required to use this app for about six months now and there hasn’t been a single time when it wasn’t like pulling teeth when trying to use it. Checking messages is one of the worst experiences I’ve ever had with any app. It takes over five minutes just to load crew mates in the chats, and an additional two minutes for the messages themselves to load. This app doesn’t make anything convenient. I’d much rather call in to change my schedule and request time off than use Altemetrics."}, {"id": "gp_5f3e7441-fd64-4f9d-bead-f2a2fb0629e8", "platform": "Google Play", "app": "Altametrics Clock", "author": "Amber Martinez", "title": "", "rating": 1, "date": "2022-03-02", "text": "It don't show me any clock only the schedule."}, {"id": "ios_8389988538", "platform": "App Store", "app": "Altametrics Clock", "author": "tumin matin", "title": "Fix it", "rating": 1, "date": "2022-02-23", "text": "I got an update on my iPhone and I can’t fix time. Don’t let me"}, {"id": "gp_d73b1651-40dd-4710-a584-ec831dfa3e77", "platform": "Google Play", "app": "Altametrics Clock", "author": "Bill Silkworth", "title": "", "rating": 3, "date": "2022-02-20", "text": "Recently, as a general manager, I cant view or edit managers' time punches. Is Says I don't have authorization. I do have authorization on the website, so It's not a permission problem. I checked with other general managers, and they are having the same issue."}, {"id": "gp_9a7c7754-bbaf-4210-b8f5-40377ef0a2a9", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Konifesi Niuamoa", "title": "", "rating": 4, "date": "2022-02-12", "text": "Would be helpful to have a check list to go back to after you enter items, if you have to enter an item that you already entered at another area, it should alert you. As I'm learning the system, it's a good system but on the other hand it depends how the company wants us to use it according to their system."}, {"id": "gp_f95cba72-a690-4d61-94bf-33984d52e491", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "Wayne", "title": "", "rating": 1, "date": "2022-02-11", "text": "Broken, won't load."}, {"id": "ios_8344418666", "platform": "App Store", "app": "Altametrics Clock", "author": "kacee816", "title": "No help", "rating": 1, "date": "2022-02-11", "text": "I can’t do any of the things this app says I can do. None of the features are available to me I can’t even see who’s on my clock😞"}, {"id": "gp_6fda6613-e92e-4f68-b8de-9df8f86c8603", "platform": "Google Play", "app": "Altametrics DAR", "author": "Jordan McVickers", "title": "", "rating": 5, "date": "2022-02-09", "text": "Awesome for tracking labor percentages and much more"}, {"id": "ios_8326776736", "platform": "App Store", "app": "Altametrics Schedules", "author": "robi3101", "title": "Doesn’t even let me log in", "rating": 2, "date": "2022-02-06", "text": "Fix this pls I can’t be late for work again"}, {"id": "ios_8307688344", "platform": "App Store", "app": "Altametrics Schedules", "author": "Me987654321244567", "title": "Have to reload frequently", "rating": 3, "date": "2022-02-01", "text": "When it works, it’s great to see my schedule without running into work. But, I have to reload app every other month. Today, even after reloading I still can’t log in. \n\nIt would be nice to see other worker schedules, so I can see who may be able to cover my shift if I can’t come in."}, {"id": "ios_8294548705", "platform": "App Store", "app": "Altametrics Schedules", "author": "22Ahourihan", "title": "Needs a new update or something!", "rating": 4, "date": "2022-01-28", "text": "It’s a good app that I didn’t even know about till rec arter way. It saves time and reduces the complexity of the user while scheduling the employees. On posting the schedule a message is delivered to the schedule employees with their scheduled time and job code. Also, the employees can offer their shift to the different employee if\nhe/she is not available at that particular time."}, {"id": "ios_2584986911", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Kirkmelin", "title": "User-friendly app", "rating": 5, "date": "2018-05-23", "text": "User-friendly and can be operated on the tab and mobile devices. It allows the user to perform smart search and also provide reports that can be imported into the third part as well for business use."}, {"id": "ios_2580813473", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Arnoldboehm", "title": "Managed inventory app", "rating": 5, "date": "2018-05-22", "text": "Zip Inventory is very interactive and awesome application where I can manage itemized catalog or the list of catalogs. It is easy to use or we can say user friendly. I have recommend my friends too, to use the application who wants to manage the Inventory in a better way."}, {"id": "ios_2576807594", "platform": "App Store", "app": "Altametrics Schedules", "author": "Arnoldboehm", "title": "Interactive app in the market", "rating": 5, "date": "2018-05-21", "text": "Zip Schedule is very interactive and awesome application for employee scheduling. It is easy to use or we can say user friendly. I have recommend my friends too, to use the application for scheduling."}, {"id": "ios_2569269600", "platform": "App Store", "app": "Altametrics Schedules", "author": "tomsellack", "title": "Better than HotSchedules", "rating": 5, "date": "2018-05-19", "text": "This app does a lot more than the one we used to use. It’s easy and it’s free which is great."}, {"id": "ios_2559373517", "platform": "App Store", "app": "Altametrics Schedules", "author": "Solomonpankow", "title": "App for employees", "rating": 5, "date": "2018-05-17", "text": "This is a very useful app for the employee who is working in different organizations or at different stores within the same organization can view his/her shifts in zip schedules."}, {"id": "ios_2559412163", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Solomonpankow", "title": "Most useful app", "rating": 5, "date": "2018-05-17", "text": "Zip inventory is a quite interactive application as all the stats will be displayed in Dashboard and search feature is available to search the items"}, {"id": "ios_2551861169", "platform": "App Store", "app": "Altametrics Schedules", "author": "Casandrawhitted", "title": "Best Scheduling App", "rating": 5, "date": "2018-05-15", "text": "A very awful app through which we can create a schedule very easily."}, {"id": "ios_2551864755", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Casandrawhitted", "title": "Easy Inventory App", "rating": 5, "date": "2018-05-15", "text": "A vey helpful application through which we can manage the Inventory."}, {"id": "gp_773b14d9-ec63-4be3-a6a6-e600b20af834", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "A Google user", "title": "", "rating": 4, "date": "2018-05-14", "text": "This app is giving great help to me during taking the inventory count. No paper, just use this ap for entry what you count in your store. Sync is also great, count from your mobile and can run reports from my iPad or PC. Thanks guys keep rocking."}, {"id": "ios_2545742655", "platform": "App Store", "app": "Altametrics Schedules", "author": "Shantaypickle", "title": "Excellent Scheduling App", "rating": 4, "date": "2018-05-14", "text": "Our employees love receiving their work schedules through the Zip Schedules mobile app. It makes team communication easy which make everyone happy and saves a lot of time. Now, we are creating more accurate schedule in minutes while getting correct labor costs under control."}, {"id": "ios_2545754885", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Shantaypickle", "title": "Paperless inventory app", "rating": 4, "date": "2018-05-14", "text": "Our managers used to maintained the inventory count sheet on Excel Sheets and paper inventory count sheets until we found the Zip Inventory mobile app.Now, we always know our real-time inventory levels without doing any manual efforts."}, {"id": "ios_2524695453", "platform": "App Store", "app": "Altametrics Schedules", "author": "Dwightvince", "title": "Great scheduling app", "rating": 5, "date": "2018-05-09", "text": "It's a great app with cool features. The best part of the application is that my managers can communicate with crew employees using the team center."}, {"id": "ios_2524720198", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "Dwightvince", "title": "Great app!!!", "rating": 5, "date": "2018-05-09", "text": "This is great inventory application for my business. I don't usually write reviews but I have been using this app for last several months and it has never failed. It's simple to use and very accurate with all my information."}, {"id": "ios_2520555342", "platform": "App Store", "app": "Altametrics Schedules", "author": "scottieburse", "title": "App for business", "rating": 5, "date": "2018-05-08", "text": "I absolutely love this app. It's very useful for our business. It helps all of my managers to see their employees schedule and phone number on their phones. They can easily see who is available and can approve shifts, availability changes etc."}, {"id": "ios_2520562027", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "scottieburse", "title": "Neat and clean app", "rating": 4, "date": "2018-05-08", "text": "It's very easy, clean and effective. I wish all other applications could be this efficient"}, {"id": "ios_2516187006", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "anthonygrahamm", "title": "Best app in category", "rating": 5, "date": "2018-05-07", "text": "It's one of the best applications I have ever used. It syncs with all devices and cloud in real time. I use my iPhone to take inventory and use my iPad or PC to look at reports and it's synced all the time"}, {"id": "ios_2516195879", "platform": "App Store", "app": "Altametrics Schedules", "author": "anthonygrahamm", "title": "Everything for employee needs", "rating": 4, "date": "2018-05-07", "text": "This is one of the great applications that I have ever used. The best part is that it's free of cost whereas some other applications from other companies charge money for this. This application has almost everything an employee needs to see their schedule and also can swap their shifts with others. I would give this application 4 stars."}, {"id": "ios_2503520370", "platform": "App Store", "app": "Altametrics Schedules", "author": "rebeljohnson", "title": "Easy to use", "rating": 4, "date": "2018-05-04", "text": "Easy to use app, makes life so much easier to see your schedule and edit in seconds."}, {"id": "ios_2503556063", "platform": "App Store", "app": "Altametrics Inventory Pro", "author": "rebeljohnson", "title": "Awesome app for manage inventory", "rating": 4, "date": "2018-05-04", "text": "I love this app so far. I am using it to take inventory in my store. It took few days to learn the application but once I learnt it, it was very simple and easy. Within 30 days of using the application, I was able to reduce my inventory time by 50%"}, {"id": "gp_18e83c0a-01e7-44e4-8f5c-e1a83fa1cddc", "platform": "Google Play", "app": "Altametrics Inventory Pro", "author": "A Google user", "title": "", "rating": 5, "date": "2018-04-26", "text": "Nice UX"}, {"id": "ios_2324307790", "platform": "App Store", "app": "Altametrics Schedules", "author": "genbolanos", "title": "Please improve", "rating": 1, "date": "2018-03-19", "text": "This is honestly the worst app for work and needs some serious improvements ! I’ve had 7shifts and HotSchedules which are awesome and better than this.\nWhat needs improving ?\n1. Notifications: this apps doesn’t notify when our schedules are out or when someone is giving away their shift. \n2. Contacts: for some reason, the contacts went away ??? Now we can’t see people’s contact information, which is needed when we need to get ahold of them. \n3. Messaging: we wouldn’t need contacts info if we could directly message in the app! Or even have a place where we could post messages like 7shifts! \n4. Work schedule: being able to see who is or isn’t working for the day would be helpful. That way we’re not wasting our time messaging people who are already working. \n5. Time off request: apparently at work we have to write down our time off request in a notebook because this app doesn’t let us request time off!! It disappears from the system once approved ??\nPlease ! Improve the app and make it useful to those who use it. There are so many changes that are needed. If I had the power to change what app we use I would."}, {"id": "ios_2214115005", "platform": "App Store", "app": "Altametrics Schedules", "author": "LV Outback", "title": "Cerca Trova.....you need help, scheduling, accounting and much more!", "rating": 1, "date": "2018-02-16", "text": "Hotschedules puts this scheduling app to shame and I am ashamed that you make Outback employees use this terrible app."}, {"id": "ios_2165583360", "platform": "App Store", "app": "Altametrics Schedules", "author": "TrvlBella", "title": "Seriously? No improvements yet?!", "rating": 1, "date": "2018-02-04", "text": "It’s been months and we’re still forced to use this inefficient app with absolutely NO improvements so far. Whoever designed it and the one subjecting us to use it not only lack compassion, they might be downright evil. I never write app reviews but my frustration level has reached astronomical proportions!!!"}, {"id": "ios_2072380859", "platform": "App Store", "app": "Altametrics Schedules", "author": "Timothy teej T", "title": "Horrible options. Buggy", "rating": 1, "date": "2018-01-09", "text": "Don’t expect to be able to do anything but see the day and time you work....maybe. The app is extremely buggy and non user friendly. It sometimes doesn’t even post some of my days. Altametrics is an absolute piece of crap."}, {"id": "ios_2043100501", "platform": "App Store", "app": "Altametrics Schedules", "author": "ysidro00", "title": "What is this...", "rating": 1, "date": "2017-12-30", "text": "App is unorganized and dysfunctional, Needs a major overhaul. If I’m scheduled in the AM I can’t see if I’m schedule in the PM The only way to find out is to call my employer."}, {"id": "ios_2030032181", "platform": "App Store", "app": "Altametrics Schedules", "author": "Kj6cea", "title": "Why do I even need this app", "rating": 1, "date": "2017-12-26", "text": "This application is missing a few things:\n*Ability to see your coworkers schedule\n*Ability to see ALL current staff and numbers if they chose to have a visible option. (Why is that even there because there's no staff list?)\n*Ability to swap shifts with ALL applicable staff ( staff scheduled for same shifts should be able to swap outside of availability and during scheduled shifts)\n*Ability to message staff AT ALL (REALLY?)\n\nHard to believe this is at all related to zip schedules...."}, {"id": "ios_2013060176", "platform": "App Store", "app": "Altametrics Schedules", "author": "The_Luruski", "title": "Would give negative stars if I could", "rating": 1, "date": "2017-12-20", "text": "This app is terrible! Not user friendly and is constantly glitchy. Wish they could see how a real workforce app works so they could mimic it at least."}, {"id": "ios_1959107961", "platform": "App Store", "app": "Altametrics Schedules", "author": "Lisatruonggg", "title": "Terrible!!!", "rating": 1, "date": "2017-11-29", "text": "Just terrible!"}, {"id": "ios_1921447594", "platform": "App Store", "app": "Altametrics Schedules", "author": "Ayemannn", "title": "Needs A TON of work", "rating": 1, "date": "2017-11-14", "text": "There is nothing good to say about this app so far other than it needs a ton of work, and from being a previous user of HotSchedules for 7 years, having to switch to this really blows. Here are some requests and suggestions for the developers from an employees standpoint:\n1. This app is not user friendly- you cannot release or pickup shifts \n2. We have no way to see our other coworkers schedule! This by far is highly frustrating and inconvenient. How am I suppose to know wether or not I am the only one scheduled that day/night or who comes in before or after me. Knowing this is very important so employees can plan accordingly.\n3. We cannot message others directly through this application, and since we don't know who is or isn't working we virtually have no way to reach other employees for a quick shift cover if needed.\nThanks! Hope this review helps and this application receives the improvements it's needed QUICKLY."}, {"id": "ios_1897575415", "platform": "App Store", "app": "Altametrics Schedules", "author": "mfranchs", "title": "Awful", "rating": 1, "date": "2017-11-04", "text": "Disgustingly Awful"}, {"id": "ios_1862323029", "platform": "App Store", "app": "Altametrics Schedules", "author": "Litte chica", "title": "I wish I could give this app zero stars.", "rating": 1, "date": "2017-10-20", "text": "This is the absolute worst scheduling app out there. After using hotschedules for 8 years this doesn’t even begin to compare. Doesn’t list the section being worked, you can’t see anyone else’s schedule, requests don’t work so we had to switch to using a notebook calendar to request time off. The format is terrible! They should be paying the company to use the app rather than the other way around."}, {"id": "ios_1854180131", "platform": "App Store", "app": "Altametrics Schedules", "author": "SRO2003", "title": "1 star", "rating": 1, "date": "2017-10-16", "text": "Terrible app! Wouldn't use it if I wasn't forced to for work. Hotshcedules was 100 times better!"}, {"id": "ios_1842998682", "platform": "App Store", "app": "Altametrics Schedules", "author": "Madidori_44", "title": "This app is absolutely terrible", "rating": 1, "date": "2017-10-11", "text": "I would rather go through the trouble of paper scheduling rather than use this app. If I could give it no stars for making work THAT much more difficult. Make this app user friendly or just get rid of it completely, it does more harm than it does help."}, {"id": "ios_1835968265", "platform": "App Store", "app": "Altametrics Schedules", "author": "Anthony from Guam", "title": "Needs Improvement", "rating": 2, "date": "2017-10-08", "text": "Coming from Hot Schedules... One feature needed is the ability to see who I’m working with."}, {"id": "ios_1830164679", "platform": "App Store", "app": "Altametrics Schedules", "author": "madoutbacker", "title": "Terrible", "rating": 1, "date": "2017-10-05", "text": "This app is awful, and it doesn't let you see your coworkers schedules. Half of the time, I can barely see my own schedule. This app needs A TON of improvement. I wish I could go back to HotSchedules."}, {"id": "ios_1797671601", "platform": "App Store", "app": "Altametrics Schedules", "author": "NikkiD1016", "title": "More like NotSchedules", "rating": 1, "date": "2017-09-18", "text": "I normally don't write reviews but this app is beyond frustrating. This app could probably have great potential but it is lacking in so many areas. You can't see anyone's schedules but your own. There's no way to get shifts covered or swap unless you text/call everyone and bother them. And that's if you have all your coworkers info in the first place. And when messages are sent out through the app they aren't reaching everyone. There's no way to show double shifts or when you're on a double shift with two different job codes. It hasn't even been a week and I miss HotSchedules."}, {"id": "ios_1786000653", "platform": "App Store", "app": "Altametrics Schedules", "author": "Your boy, blue", "title": "Read me!!", "rating": 1, "date": "2017-09-11", "text": "Hi! I just wanted to say that it is greatly inconvenient to have no access to co-workers via in app-scheduling, which is something my previous app allowed me to do. This is causing an abrupt left turn, in terms of fluidity. I think that it's important to have open communications that allow me to interact with individuals whom I actively see and conduct daily business with on a regular basis, this includes;\n•Ability to see what days I'm working and who I'm working with. \n•Ability to swap and pickup shifts with and from other employees.\nThese issues are really basic, but can still be really easily over looked! However, If things like this are left unaddressed, then they'll never continue to as is a simplicities error, which is annoying at most, resolves then to fester . Just my two cents, thank you for your time. :)"}, {"id": "m_35962387b228b308", "platform": "Comparably", "app": "", "author": "Operations Dept", "title": "[Outlook · Constructive] What's going wrong and how can it be improved?", "rating": null, "date": "2017-04-21", "text": "Back stabbing company with terrible products and upset customers."}, {"id": "m_56253135aee4f251", "platform": "Comparably", "app": "", "author": "Operations Dept", "title": "[Compensation · Constructive] Why do you feel undervalued and what would make you feel better about your compensation?", "rating": null, "date": "2017-04-21", "text": "Terrible. Compensation is extremely low. High turnover"}, {"id": "m_f43ad3431cb7e4db", "platform": "Comparably", "app": "", "author": "Operations Dept", "title": "[Leadership · Constructive] What does the leadership team need to get better at?", "rating": null, "date": "2017-04-21", "text": "Vision without execution. Projects and strategies executed 70%"}]};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => d.toISOString().slice(0,10);
const fmtDate = s => s ? new Date(s + "T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
const hasRating = r => r.rating != null && r.rating !== "";
const keyOf = r => r.app ? `${r.platform} · ${r.app}` : r.platform;
const shortApp = a => (a || "").replace(/^Altametrics\s+/, "");

const GROUPS = [
  {name:"Mobile apps", test:p => p === "App Store" || p === "Google Play"},
  {name:"Employer reviews", test:p => ["Glassdoor","Indeed","Comparably"].includes(p)},
  {name:"Software reviews", test:() => true},
];
const groupOf = p => GROUPS.findIndex(g => g.test(p));

const sources = [...new Set([...Object.keys(DATA.status), ...DATA.reviews.map(keyOf)])].map(k => {
  const [platform, app] = k.split(" · ");
  return {key:k, platform, app:app || ""};
}).sort((a,b) => (a.app || "~").localeCompare(b.app || "~") || a.platform.localeCompare(b.platform));

const state = {from:"", to:"", q:"", source:"", shown:50};

$("brand").textContent = `${DATA.company} reviews`;
$("updated").textContent = "Updated " + new Date(DATA.generated).toLocaleString(undefined,{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});

function health(st){
  if (!st || st.source === "manual") return {ok:true, text:""};
  if (st.ok === false) return {ok:false, text:"Last update failed. Run the sync again; if it keeps failing, check the log."};
  const ageH = st.last_success ? (Date.now() - new Date(st.last_success)) / 36e5 : 1e9;
  if (ageH > 48) return {ok:false, text: st.last_success ? `No update since ${new Date(st.last_success).toLocaleDateString()}. Check that the laptop sync is running.` : "Never updated yet."};
  return {ok:true, text:""};
}
const inRange = r => (!state.from || r.date >= state.from) && (!state.to || r.date <= state.to);
function matches(r){
  if (!inRange(r)) return false;
  if (state.source && keyOf(r) !== state.source) return false;
  if (state.q) return `${r.title} ${r.text} ${r.author}`.toLowerCase().includes(state.q.toLowerCase());
  return true;
}
function avg(list){ const rs = list.filter(hasRating); return rs.length ? rs.reduce((a,r) => a + Number(r.rating), 0) / rs.length : null; }

function renderHero(){
  const list = DATA.reviews.filter(inRange);
  const a = avg(list);
  const days = document.querySelector('.seg [aria-pressed="true"]')?.dataset.days;
  const span = days === "0" ? "in total" : days ? `in the last ${days} days` : "in this period";
  const avgTxt = a ? `, averaging ${a.toFixed(1)} <span class="star">★</span>` : "";
  $("headline").innerHTML = days === "0"
    ? `${list.length.toLocaleString()} reviews collected so far${avgTxt}`
    : list.length
      ? `${list.length.toLocaleString()} new review${list.length === 1 ? "" : "s"} ${span}${avgTxt}`
      : `No new reviews ${span}`;
  const issues = sources.filter(s => !health(DATA.status[s.key]).ok).map(s => s.app ? `${s.platform} (${shortApp(s.app)})` : s.platform);
  const sub = $("subline");
  sub.className = issues.length ? "alert" : "";
  sub.textContent = issues.length
    ? `${issues.length} source${issues.length > 1 ? "s need" : " needs"} attention: ${issues.join(", ")}.`
    : `All ${sources.length} sources updated normally.`;
}

function renderBoard(){
  $("board").innerHTML = GROUPS.map((g, gi) => {
    const items = sources.filter(s => groupOf(s.platform) === gi);
    if (!items.length) return "";
    return `<div class="group"><h2>${g.name}</h2>${items.map(s => {
      const st = DATA.status[s.key] || {}, sum = st.summary || {}, h = health(st);
      const all = DATA.reviews.filter(r => keyOf(r) === s.key);
      const n = all.filter(inRange).length;
      let rating, bar, meta;
      if (sum.positive_pct != null){
        rating = `<div class="rating num">${sum.positive_pct}%</div>`;
        bar = `<div class="bar pos"><i style="width:${sum.positive_pct}%"></i></div>`;
        meta = `${Number(sum.total_reviews).toLocaleString()} reviews, share positive`;
      } else if (sum.rating){
        rating = `<div class="rating num">${Number(sum.rating).toFixed(1)}</div>`;
        bar = `<div class="bar"><i style="width:${sum.rating / 5 * 100}%"></i></div>`;
        meta = sum.total_ratings ? `${Number(sum.total_ratings).toLocaleString()} ratings`
             : sum.total_reviews != null ? `${Number(sum.total_reviews).toLocaleString()} reviews on site` : "";
      } else {
        const a = avg(all);
        rating = a ? `<div class="rating num">${a.toFixed(1)}</div>` : `<div class="rating none">No rating</div>`;
        bar = `<div class="bar">${a ? `<i style="width:${a / 5 * 100}%"></i>` : ""}</div>`;
        meta = sum.total_reviews === 0 ? "No public reviews yet" : `${all.length} saved`;
      }
      const name = s.app ? `${esc(shortApp(s.app))}<small>${esc(s.platform)}</small>` : esc(s.platform);
      return `<button class="row" data-key="${esc(s.key)}" aria-pressed="${state.source === s.key}">
        <span class="src">${name}</span>${rating}${bar}
        <span class="meta"><span class="health${h.ok ? "" : " bad"}"></span>${esc(meta)}${h.ok ? "" : `<br><span class="bad">${esc(h.text)}</span>`}</span>
        <span class="new${n ? "" : " zero"}"><b class="num">${n}</b>new</span>
      </button>`;
    }).join("")}</div>`;
  }).join("");
  $("board").querySelectorAll(".row").forEach(b => b.onclick = () => {
    state.source = state.source === b.dataset.key ? "" : b.dataset.key;
    state.shown = 50; render();
    if (state.source) $("feedtitle").scrollIntoView({behavior:"smooth", block:"start"});
  });
}

function renderFeed(){
  const list = DATA.reviews.filter(matches);
  const src = sources.find(s => s.key === state.source);
  $("feedtitle").textContent = src ? `Reviews from ${src.app ? shortApp(src.app) + " on " + src.platform : src.platform}` : "Latest reviews";
  const a = avg(list);
  $("feedmeta").innerHTML = `${list.length.toLocaleString()} review${list.length === 1 ? "" : "s"}${a ? `, average ${a.toFixed(1)} ★` : ""}`
    + (state.source || state.q ? ` <button class="clear" id="clear">Show all sources</button>` : "");
  const c = $("clear");
  if (c) c.onclick = () => { state.source = ""; state.q = ""; $("q").value = ""; render(); };

  const feed = $("feed");
  if (!list.length){
    feed.innerHTML = `<li class="empty">No reviews match. Try a longer date range or clear the search.</li>`;
    $("loadmore").hidden = true; return;
  }
  feed.innerHTML = list.slice(0, state.shown).map(r => {
    const r5 = hasRating(r) ? Math.round(Number(r.rating)) : 0;
    const stars = hasRating(r) ? `<span class="stars" aria-label="${esc(r.rating)} out of 5">${"★".repeat(r5)}${"☆".repeat(5 - r5)}</span>` : "";
    let title = r.title || "", tag = "";
    const m = title.match(/^\[(.+?) · (Positive|Constructive)\]\s*(.*)$/);
    if (m){ tag = `<span class="tag${m[2] === "Constructive" ? " cons" : ""}">${esc(m[1])}${m[2] === "Constructive" ? ", constructive" : ""}</span>`; title = m[3]; }
    const long = (r.text || "").length > 260;
    return `<li class="item">
      <div class="item-top">${stars}<span class="tag">${esc(r.app ? shortApp(r.app) + ", " + r.platform : r.platform)}</span>${tag}<span class="num">${fmtDate(r.date)}</span></div>
      ${title ? `<h3>${esc(title)}</h3>` : ""}
      <p>${esc(r.text)}</p>
      ${long ? `<button class="more-text">Read full review</button>` : ""}
      ${r.author ? `<div class="author">${esc(r.author)}</div>` : ""}
    </li>`;
  }).join("");
  feed.querySelectorAll(".more-text").forEach(b => b.onclick = () => {
    const li = b.closest(".item"); li.classList.toggle("open");
    b.textContent = li.classList.contains("open") ? "Show less" : "Read full review";
  });
  const lm = $("loadmore");
  lm.hidden = list.length <= state.shown;
  lm.textContent = `Show ${Math.min(50, list.length - state.shown)} more`;
}

function render(){ renderHero(); renderBoard(); renderFeed(); }

function setPreset(days){
  const today = new Date();
  state.to = iso(today); state.from = days ? iso(new Date(today - days * 864e5)) : "";
  $("from").value = state.from; $("to").value = state.to;
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true"); setPreset(Number(b.dataset.days)); state.shown = 50; render();
});
["from", "to"].forEach(id => $(id).onchange = () => {
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", "false"));
  state.from = $("from").value; state.to = $("to").value; state.shown = 50; render();
});
let t;
$("q").oninput = e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); state.shown = 50; renderFeed(); }, 200); };
$("loadmore").onclick = () => { state.shown += 50; renderFeed(); };

setPreset(30); render();
</script>
</body>
</html>
