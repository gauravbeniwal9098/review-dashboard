my scheduling herself, but we were still unable to get through. \nIt always says “configure the application” no matter if what we put in is correct or not. I’m unsure if this is just a bug or not but it has done this on three of my different phones and my gm said she’s never encountered something like that before me. \nAnd so any time I need to request a day off, I have to tell her in person (which can be hard, considering we work different shifts).\nAny help with this issue would be appreciated."}, {"id": "ios_9989668517", "platform": "App Store", "author": "dani.ann*", "title": "Went Wrong", "rating": 2, "date": "2023-06-01", "text": "I used to use this app all the time and it was perfect. About 2ish weeks ago it stopped working. I went to open it and it wouldn’t accept my password, which I knew was correct. I went to reset the password and I can’t get past the part when you’re sent the security code. It gets sent to my email, but when it is supposed to go to my phone I never get it. I’m not sure if this is just a glitch created by an update or what. Please fix this!"}, {"id": "ios_9987214443", "platform": "App Store", "author": "Haleigh2210473", "title": "Horrible", "rating": 1, "date": "2023-06-01", "text": "0/10!!\n\nNever works\nAlways logging you out\nNever sends a recovery email or text or call\nHalf the time doesn’t work \nHorrible to use!"}, {"id": "ios_9970812375", "platform": "App Store", "author": "Coopy-Fig", "title": "Cant even get past the login.", "rating": 1, "date": "2023-05-27", "text": "I have been waiting for a week for my “request to be submitted”. This app won’t even let me get past the login page to view the schedule at my new job and everyone I talked to there says even when they get in it’s one of the worst apps to ever use. From what I’ve seen it crashes constantly, is slow, and half the time the schedules are just wrong, no clue why, they just change the schedule on us. Still would be nice to even GET PAST THE LOGIN."}, {"id": "ios_9955791628", "platform": "App Store", "author": "sndbdbdbbdd", "title": "Can’t get in", "rating": 1, "date": "2023-05-22", "text": "It won’t let me log in"}, {"id": "ios_9955198158", "platform": "App Store", "author": "Daltontravelstead1", "title": "Not work", "rating": 1, "date": "2023-05-22", "text": "I never get a code to active my account it was working a month ago signed me out now I can’t get my schedule"}, {"id": "ios_9955092085", "platform": "App Store", "author": "Tomas James Moffett", "title": "No support", "rating": 1, "date": "2023-05-22", "text": "Never received a activation code ever"}, {"id": "ios_9955060647", "platform": "App Store", "author": "Magneato👌🏻👌🏻", "title": "Horrible, slow, and always crashes", "rating": 1, "date": "2023-05-22", "text": "I work at McDonald’s and I have to use this app. I can’t request off because no one knows how to even look for the time off requests of this app anymore, I can’t look at my schedule without it bugging out, and now it’s booted me off and won’t let me back in. It says it’s sending some code to my email but it never does. Unbelievable. \nI wish my job didn’t have to have this but it’s quite literally the only way to see my schedule. Fix your app and do better"}, {"id": "ios_9954841979", "platform": "App Store", "author": "chee_(3", "title": "Good But some bad things", "rating": 1, "date": "2023-05-22", "text": "The app overall is good, but recently the app shut down which made me unable to view my work schedule.\n\nSo I tried to reset my password and now I am unable to log back in even with phone number or email.\n\nThey said they sent verification code but they won't show up and now I can't even access the login anymore with out the password reset screen popping up in stead of the regular long in."}, {"id": "ios_9953426314", "platform": "App Store", "author": "Carson Ram", "title": "Customer Service", "rating": 1, "date": "2023-05-22", "text": "I used to be able to get into my account and the app was working great until one day it logs me out and I can’t log back in. I try to get the verification code to my email and to my phone and it never sends to me. I therefore rate it 1 star because I need to get into my account to see when I work but I am unable to get in and the customer service does not help because I already sent 5-6 messages so I can get back my account and not a single one was responded to. Fix this problem."}, {"id": "ios_9952227645", "platform": "App Store", "author": "DaisyNaisy", "title": "Stick with paper schedule", "rating": 1, "date": "2023-05-21", "text": "My job uses this for our scheduling. This is my first time ever using this app and even hearing about it. So basically it never really works. I can’t see my schedule all the time. This is highly inconvenient for anyone. The paper schedules is a mess so I thought how great would it be to use this app and see everything. You can only see your schedule on for that week. You really can’t see it for the whole entire month or even for the next week. I don’t like this app at all. I really wish our company would find another app for scheduling. This is not it. The constant updates are useless if it’s constantly not working. I prefer to just go old school and get a paper copy and call it day."}, {"id": "ios_9951817402", "platform": "App Store", "author": "Jeanette_demere", "title": "Terrible App", "rating": 1, "date": "2023-05-21", "text": "It won’t let me log back in with my email and every time it says it’s sending me a verification code it doesn’t show up in my inbox."}, {"id": "ios_9951618370", "platform": "App Store", "author": "the vibess😂", "title": "Verification code", "rating": 1, "date": "2023-05-21", "text": "I tried to look at my schedule yesterday and there was an error logging me in, so I logged out. When I tried to log back in and send a verification code I never got one. So I tried again and again. I’ve been trying for hours and it still doesn’t work. This app is annoying and makes me frustrated. Fix it now because I don’t know my schedule anymore."}, {"id": "ios_9949176347", "platform": "App Store", "author": "Johnnyblah1992", "title": "Horrible", "rating": 1, "date": "2023-05-20", "text": "This app is horrible it has so many bugs and needs a lot of work! It logs me out all the time it doesn’t show the correct hours I’ve worked ! I don’t know why companies use this app it’s good for nothing !!!"}, {"id": "ios_9949156799", "platform": "App Store", "author": "Dahmenez", "title": "Issues", "rating": 1, "date": "2023-05-20", "text": "The app was good at first, but then all of a sudden it signed me out then it told me to reset my password, and keeps asking for my email or phone number to activate it but won’t send me the code no matter how I much I click resend, now I don’t even know when I gotta be to work tomorrow."}, {"id": "ios_9948902830", "platform": "App Store", "author": "pikbow", "title": "Arggg", "rating": 1, "date": "2023-05-20", "text": "I am freaking out because this is the only way I can see my schedule for work and I have tried everything and the app is not letting me login or give me the information to login like the codes."}, {"id": "ios_9947756577", "platform": "App Store", "author": "Snowflakenewbie", "title": "Help!", "rating": 2, "date": "2023-05-20", "text": "I’ve been having trouble with your app all day so I decided to delete and redownload to see if it would work and force restarting my phone but after I redownloaded the app it won’t give me the verification on my email, phone, or text so I can’t login into my schedule and I need to know my schedule! What happened before I deleted and redownloaded was that it was an error of maintenance checking or whatever and would let me login with my password or face which led me to redownloading it after deleting it"}, {"id": "ios_9946590164", "platform": "App Store", "author": "parryjr", "title": "Needs work… like a lot of work.", "rating": 2, "date": "2023-05-20", "text": "The app randomly logs you out, then requires activation codes to let you log back on. It never sends you any codes and so you’re not able to get into the app. Make that make sense,"}, {"id": "ios_9946389399", "platform": "App Store", "author": "MOAmuse", "title": "Multiple issues and questions", "rating": 1, "date": "2023-05-20", "text": "I don’t know how else to contact you guys so I’ll just go through reviews. I can’t seem to get any verification code sent my way which is weird because it used to work just fine. Now I don’t know my schedule. Also I was wondering if the same email or phone number could be used across multiple scheduling accounts or if I’d need to have that changed? I tried looking it up but didn’t find anything so now I feel lost. Now when I try to open the app it won’t even load the home screen."}, {"id": "ios_9945586382", "platform": "App Store", "author": "Moth_Man_3000", "title": "Almost always down for maintenance", "rating": 1, "date": "2023-05-19", "text": "App has been “down for maintenance” all day. Not sure what kind of maintenance takes all day for an app whose problems are never fixed or it this is just a glitch but it happens way too often for me and my coworkers. It gets really annoying when the one job the app has is to show you your schedule and it can’t even do that half the time because it won’t even let you log in to see it."}, {"id": "ios_9888690879", "platform": "App Store", "author": "KyBBN", "title": "Slowwwww", "rating": 1, "date": "2023-05-03", "text": "This app is so slow. Always has been and continually gets worse. We were paying for another vendor to pull the schedules from Altametrics but it wasn’t being highly utilized so went back to this app. It takes in excess of a minute to load messages. And that’s if it even loads at all."}, {"id": "ios_9830193686", "platform": "App Store", "author": "MightyRufo", "title": "A swing.. and a miss…", "rating": 2, "date": "2023-04-16", "text": "No integration with Apple Calander? What about the fact that “today” doesn’t change when opening the app after opening it previously from a different day, yet it still takes 5 seconds for it to “refresh”. Random sms code requests which disappear after closing and reopening the app? Multiple password for internal and external access? Why? No widget support either!? How about integration with third party calendars? External access to email? Apple Mail client support? The only reason I use it, is because I have to."}, {"id": "ios_9814936168", "platform": "App Store", "author": "MyLifeSuckz", "title": "Doesn’t let you access", "rating": 4, "date": "2023-04-12", "text": "You all really need to work on your app.  90% of the time I try to get on to check and see who is on my clock or to see who’s late or hasn’t showed up it tells me I have been logged out and need to log back in.  The schedule and clock are the only ones to do this.  Fix the problem"}, {"id": "ios_9801818203", "platform": "App Store", "author": "@lon3rsparadise", "title": ".", "rating": 1, "date": "2023-04-08", "text": "this app is sum dookie"}, {"id": "ios_9747867996", "platform": "App Store", "author": "something...........", "title": "This app is so bad employees refuse to use it", "rating": 1, "date": "2023-03-24", "text": "The place I work at uses this app it takes ten years to load if you have an older device and even then with a newer device some features take forever to load.  It honestly prevents people from checking the app and picking up shifts"}, {"id": "ios_9717757528", "platform": "App Store", "author": "Blueranger410", "title": "Annoying", "rating": 1, "date": "2023-03-15", "text": "I find that the features of the app work but I continually have to redownload the app to fix an issue where the app begins to open, turns translucent, and disappears."}, {"id": "ios_9550186448", "platform": "App Store", "author": "jsnsnsssmmsakaiqkwyyyyyy", "title": "Won’t load", "rating": 1, "date": "2023-01-26", "text": "I keep opening the app and it stays on the blue circle I’ve restarted my phone, I’ve deleted the app and still it keeps doing it, I’m just trying to check my schedule."}, {"id": "ios_9508430709", "platform": "App Store", "author": "Johnny blaze zero", "title": "Needs more work", "rating": 3, "date": "2023-01-14", "text": "The app is to bad just better data tracking and faster loading screens"}, {"id": "ios_9433761482", "platform": "App Store", "author": "parkerizme", "title": "Unstable and holiday ruin", "rating": 2, "date": "2022-12-25", "text": "Site(s) not configured for applications.. your app cant app its app?"}, {"id": "ios_9374143275", "platform": "App Store", "author": "Jackieeb57", "title": "Terrible!", "rating": 1, "date": "2022-12-08", "text": "Have been using this app since July, October comes and the app requires me to login using my email address and password. I did and the app says it’s wrong. I emailed them they emailed me back with someone else’s email address for me to use????? I just emailed them and nothing! This is beta terrible app! Fix it please!!!!"}, {"id": "ios_9292986977", "platform": "App Store", "author": "Matthew Lepka", "title": "Terrible", "rating": 1, "date": "2022-11-15", "text": "Whoever is charge of this app or runs it terrible communication no phone number to call no nothing. I need to get my stubs but they don’t care major thumbs down."}, {"id": "ios_9287587729", "platform": "App Store", "author": "gsicyaycusgc", "title": "#", "rating": 1, "date": "2022-11-13", "text": "It will not send me a verification code when i put in my phone number"}, {"id": "ios_9265349569", "platform": "App Store", "author": "bpb309", "title": "WORK ON THIS APPS NOTIFICATION‼️‼️‼️", "rating": 1, "date": "2022-11-07", "text": "NO NOTIFICATIONS OF POEPLE WANTING A DAY OFF OR COVERING A SHIFT"}, {"id": "ios_9246400563", "platform": "App Store", "author": "iReviewAppsOccasionally", "title": "One star removed for…", "rating": 1, "date": "2022-11-02", "text": "Slowly loading between tabs. I’ve never used an app like this before. Why does your app take so long to load ChitChat/Notifications and other tabs in the menu? I’m getting tired of seeing the message, “No Data to Display !!” Please fix this for everyone. I’m not the only one at work that complains about this problem. Also, if I’m typing a message to someone, the text field seems to no longer receive input from my keyboard. Again, very annoying. There’s no way these are features. Definitely bugs. If there is no way right now to fix these bugs, then please go back to the drawing board or hire new developers. Please. Thanks."}, {"id": "ios_9224673351", "platform": "App Store", "author": "brueosk", "title": "uh", "rating": 2, "date": "2022-10-26", "text": "keeps logging me out and won’t send me verification codes and if they do they won’t work 😐"}, {"id": "ios_9217173454", "platform": "App Store", "author": "tjay828293393939284648393940", "title": "I’ve tried too many times", "rating": 1, "date": "2022-10-24", "text": "When I try logging in an I put my number an never sends the verification code to my number"}, {"id": "ios_8978822252", "platform": "App Store", "author": "josephmother847", "title": "Not great, but does the job", "rating": 3, "date": "2022-08-14", "text": "Extremely slow and unoptimized"}, {"id": "ios_8702274944", "platform": "App Store", "author": "dejazimm", "title": "bug fixes pls", "rating": 1, "date": "2022-05-23", "text": "before i updated the app, i had no problems loading the “chitchat” portion although it took a long time to load. now anytime i try to open it it loads for ab the same time, maybe max a minute, and then says “no data to display” and freezes my app entirely. i am dependent on this app for most my covers and to communicate with my managers because they don’t give out personal numbers. it worked no problem before. like it won’t show the private messages or the whole group chat which is what we mainly message in. please fix this asap. i also would like to see another peoples schedules so i can know who to text when needing someone to cover my shift or to know who i’m going to be working with that shift. the main thing is the chat right now tho."}, {"id": "ios_8511488491", "platform": "App Store", "author": "nintendoswitchuser", "title": "code", "rating": 2, "date": "2022-03-30", "text": "The app is not letting me login and view my schedule for work. Whenever I try to login it wants me to enter a code but it’s not letting me even though I already have an account for this app. The code didn’t expire and just got the code. Explanation, now"}, {"id": "ios_8425526376", "platform": "App Store", "author": "MajoraLink", "title": "Unbelievably painful to use.", "rating": 1, "date": "2022-03-05", "text": "I work for McDonald’s and, at our location, this is the app we use to manage schedules, messaging crew mates, requesting time off, etc. I’ve been required to use this app for about six months now and there hasn’t been a single time when it wasn’t like pulling teeth when trying to use it. Checking messages is one of the worst experiences I’ve ever had with any app. It takes over five minutes just to load crew mates in the chats, and an additional two minutes for the messages themselves to load. This app doesn’t make anything convenient. I’d much rather call in to change my schedule and request time off than use Altemetrics."}, {"id": "ios_8326776736", "platform": "App Store", "author": "robi3101", "title": "Doesn’t even let me log in", "rating": 2, "date": "2022-02-06", "text": "Fix this pls I can’t be late for work again"}, {"id": "ios_8307688344", "platform": "App Store", "author": "Me987654321244567", "title": "Have to reload frequently", "rating": 3, "date": "2022-02-01", "text": "When it works, it’s great to see my schedule without running into work. But, I have to reload app every other month. Today, even after reloading I still can’t log in. \n\nIt would be nice to see other worker schedules, so I can see who may be able to cover my shift if I can’t come in."}, {"id": "ios_8294548705", "platform": "App Store", "author": "22Ahourihan", "title": "Needs a new update or something!", "rating": 4, "date": "2022-01-28", "text": "It’s a good app that I didn’t even know about till recently sense it’s not promoted but all of a sudden it’s crashing like crazy, I don’t know why but it’s always crashing but besides that it’s a good app to get my schedule."}, {"id": "ios_8255769653", "platform": "App Store", "author": "nikks89", "title": "Worse app", "rating": 1, "date": "2022-01-18", "text": "Always shuts down and we can’t retrieve our schedule.  The chit chat part takes ages to load and has to be reloaded anytime some one replies."}, {"id": "ios_8221061482", "platform": "App Store", "author": "Hillary Price", "title": "Nice!", "rating": 5, "date": "2022-01-09", "text": "Very good app, definitely recommend to friends and family"}, {"id": "ios_8221061347", "platform": "App Store", "author": "Dayne Torp", "title": "I look forward to more new apps like this", "rating": 5, "date": "2022-01-09", "text": "I nice for job I can see my of work,"}, {"id": "ios_8221061306", "platform": "App Store", "author": "Rosario Shyann", "title": "Great app!!", "rating": 5, "date": "2022-01-09", "text": "Quick way to view my work schedule!!!"}, {"id": "ios_8221061250", "platform": "App Store", "author": "Kenny Leuschke", "title": "Very useful", "rating": 5, "date": "2022-01-09", "text": "makes life so much easier!"}, {"id": "ios_8221058108", "platform": "App Store", "author": "Morris Schroeder 1991", "title": "Try it", "rating": 5, "date": "2022-01-09", "text": "Very nice way to do schedules and keep communication with your staff."}, {"id": "ios_8221058052", "platform": "App Store", "author": "Alene Wolff", "title": "I love this", "rating": 5, "date": "2022-01-09", "text": "Works great and makes it easy to check when you work"}, {"id": "ios_8221057938", "platform": "App Store", "author": "Gladyce Anderson", "title": "Very well", "rating": 5, "date": "2022-01-09", "text": "Easy to use, nice to be able to access my schedule quickly."}, {"id": "ios_8214089131", "platform": "App Store", "author": "Im Intyx", "title": "App not working", "rating": 3, "date": "2022-01-07", "text": "App is currently down which is hard for me to know my schedule 🙁"}, {"id": "ios_8144028641", "platform": "App Store", "author": "LCWPOP", "title": "It won’t load the chitchat", "rating": 3, "date": "2021-12-18", "text": "I have been trying to contact my managers but when I hit chitchat it would load for about 30seconds and then nothing. Please fix it. It’s good for scheduling and talking the people when it was working"}, {"id": "ios_8022337254", "platform": "App Store", "author": "nightmarenaty", "title": "Issues continue", "rating": 1, "date": "2021-11-14", "text": "Fix the app already. It’s fine for a bit then logs out and won’t let me sign back in saying “this service is currently unavailable.” This is twice in less than a month."}, {"id": "ios_8022152918", "platform": "App Store", "author": "Heathcliff100", "title": "Unreliable", "rating": 1, "date": "2021-11-13", "text": "This app make me reset my password every 10 try’s I login in it’s so frustrating I really need it for my work schedule."}, {"id": "ios_7980361841", "platform": "App Store", "author": "Assunta_Smitham", "title": "This app is great", "rating": 5, "date": "2021-11-02", "text": "I love this app so much.. It'svery helpful to me.. No issues at all"}, {"id": "ios_7980361773", "platform": "App Store", "author": "Margie Pagac", "title": "Surprised!", "rating": 5, "date": "2021-11-02", "text": "This app is great for organization especially as a student."}, {"id": "ios_7980361719", "platform": "App Store", "author": "Libby Considine", "title": "I really like it", "rating": 5, "date": "2021-11-02", "text": "Very good app for students and jobers ❤❤❤i love this app so much it reminds and notified"}, {"id": "ios_7968630897", "platform": "App Store", "author": "Nicolas Kovacek", "title": "Cool App", "rating": 5, "date": "2021-10-29", "text": "the application is just awesome i wished if there was a track for attends. and web based app for better utilization of notes. pls relply is the above things are possible 😊"}, {"id": "ios_7968630680", "platform": "App Store", "author": "Wilderman Hyatt", "title": "I really like it", "rating": 5, "date": "2021-10-29", "text": "Easy to use. Uses very little memory. Does everything it promises. As a teacher I've tried a number of Schedules apps."}, {"id": "ios_7961901581", "platform": "App Store", "author": "Heidi Iva", "title": "Wonderful!", "rating": 5, "date": "2021-10-28", "text": "Fantastic app. Works great for everything i need. It would be nice to have the end time of a routin and event shown so i dont forget when it should end. But other than that 5 stars. Best app for getting organized."}, {"id": "ios_7952835365", "platform": "App Store", "author": "Alison Aufderhar", "title": "I guess will use it for a long time.", "rating": 5, "date": "2021-10-25", "text": "I just got the app and already im obsessed i love technology now thank u 🤗🤗🤗🤗"}, {"id": "ios_7952827065", "platform": "App Store", "author": "Manley Dietrich", "title": "Great app overall", "rating": 5, "date": "2021-10-25", "text": "it's easy to see your schedule"}, {"id": "ios_7949109425", "platform": "App Store", "author": "Darlene Effertz", "title": "Easy to use!!", "rating": 5, "date": "2021-10-24", "text": "Perfect for work"}, {"id": "ios_7949109333", "platform": "App Store", "author": "Patrick Damore", "title": "The interface is really impressive", "rating": 5, "date": "2021-10-24", "text": "love it! great features, love having different routines i can establish. We all have different parts of our lives that affect our productivity. Being able to establish routines out of all of them and see them in one place - priceless!"}, {"id": "ios_7949109204", "platform": "App Store", "author": "Langosh Schoen", "title": "Truly satisfied", "rating": 5, "date": "2021-10-24", "text": "The absolute BEST of all time management/schedule apps I can find and have ever used. It is absolutely phenomenal for scheduling out your days/weeks and getting yourself into a routine and kept on track, as well as tracking your hours spent daily on certain tasks. 10/10, A+ app."}, {"id": "ios_7949109086", "platform": "App Store", "author": "Cassie Eliane", "title": "Great!", "rating": 5, "date": "2021-10-24", "text": "This is a great app to manage schedule. interface and otherthings are perfect. But I wish, the on-screen notification should be like the lock screen popup (card type) notification and other thing is about the widget interface. It's not bad but can be more attractive."}, {"id": "ios_7945356538", "platform": "App Store", "author": "Jfkdkckdkwjdjjfkkdnfntnr", "title": "Buggy, Slow", "rating": 3, "date": "2021-10-23", "text": "This is a great app to see schedules and swap shifts, but it becomes slow sometimes. Logs me out with an error of “something went wrong. Please login and try again.” Won’t let me back in. What the heck? It was working fine two days ago and now that? Please fix it, it’s a good app but tell us or give as an FAQ for errors like these."}, {"id": "ios_7940721041", "platform": "App Store", "author": "17361519", "title": "Why does this app malfunction all the time?", "rating": 2, "date": "2021-10-22", "text": "This app will be down for a whole day sometimes. It will ask you to log out and log in again. Nothing will change. You can switch airplane mode in and out. Restart your phone. Check for updates. Nothing will help. This happens 3-4 times a month. And there is never any explanation like “maintenance”."}, {"id": "ios_7933715662", "platform": "App Store", "author": "Naomi Sawayn", "title": "Truly satisfied", "rating": 5, "date": "2021-10-20", "text": "Great app that helped me get up and do what I had scheduled loved it!"}, {"id": "ios_7933715623", "platform": "App Store", "author": "Maude Adams", ager", "rating": 3, "date": "2019-02-18", "text": "Zip Schedules has its pros and cons. Mostly pros from what I have been dealing with day to day basis. From a scheduling standpoint, once shifts are approved/ disapproved they disappear!! Managers need a section labeled “Time Request” to view time/ day request. \nIt would be wonderful if the information would transfer over to Mcd Altametrics to avoid any lost request as well as employee guarantee to have off. Just as all, change in availability, should already be transferred over to e*Restaurant. I haven’t come across this yet...\nMany of crew have complained about using the app saying it’s not user friendly."}, {"id": "ios_3051054936", "platform": "App Store", "author": "Hickup 84", "title": "Worst App Ever!", "rating": 1, "date": "2018-08-11", "text": "This app is the worst ever. Can’t update availability if a request off is in. Routinely just spins trying to save work completed. After so long even if you have saved information, the app will time you out. You then will have to re-login and figure out what got saved and finish your work. Some team members cannot even cancel their request off if something comes up. Some can."}, {"id": "ios_2853276353", "platform": "App Store", "author": "itlittttty", "title": "TERRIBLE !!!", "rating": 1, "date": "2018-07-06", "text": "The worst app I have EVER tried to use for scheduling. You can’t request off, see your coworkers shifts, and it doesn’t tell you what your position is. Would never recommend."}, {"id": "ios_2821681457", "platform": "App Store", "author": "Erma J. Liriano", "title": "a perfect product", "rating": 5, "date": "2018-07-02", "text": "now I'm indispensable app, I have a habit of working and planning together app"}, {"id": "ios_2821660024", "platform": "App Store", "author": "John M. Nichols", "title": "The app is great", "rating": 5, "date": "2018-07-02", "text": "I do not have anything to complain about"}, {"id": "ios_2821649648", "platform": "App Store", "author": "Fred D. McCoy", "title": "The interface is nice and easy to understand", "rating": 5, "date": "2018-07-02", "text": "Again there are instructions and suggestions, help me set up quickly"}, {"id": "ios_2821466835", "platform": "App Store", "author": "Joann J. Narron", "title": "reminded me correctly", "rating": 5, "date": "2018-07-02", "text": "Help me to focus on work, complete the plan"}, {"id": "ios_2821455010", "platform": "App Store", "author": "Mathilde R. Shilling", "title": "We highly appreciate this product", "rating": 5, "date": "2018-07-02", "text": "The app is extremely easy to use with a simple interface that is fully functional, accurate and stable"}, {"id": "ios_2821443327", "platform": "App Store", "author": "Emil W. Freeman", "title": "A meaning product", "rating": 5, "date": "2018-07-02", "text": "It is very effective for managers and managers when it is difficult to constantly reach the company continuously, but can still manage the performance of employees."}, {"id": "ios_2821428598", "platform": "App Store", "author": "Gladys J. Weathers", "title": "extremely convenient for me", "rating": 5, "date": "2018-07-02", "text": "I can go to the office without having to go to work"}, {"id": "ios_2821324678", "platform": "App Store", "author": "Jeanette J. Smith", "title": "Altametrics ZipSchedules - the right choice", "rating": 5, "date": "2018-07-02", "text": "If you're still confused about how to manage your work, plan each one on the app"}, {"id": "ios_2821311784", "platform": "App Store", "author": "Archie W. McLean", "title": "10 points for the app", "rating": 5, "date": "2018-07-02", "text": "A great work scheduling application"}, {"id": "ios_2821300198", "platform": "App Store", "author": "Scott D. Choi", "title": "very good quality", "rating": 5, "date": "2018-07-02", "text": "That's what I feel after a month of app experience"}, {"id": "ios_2821136716", "platform": "App Store", "author": "Craig M. Smith", "title": "Very detailed work schedule", "rating": 5, "date": "2018-07-02", "text": "With detailed employee schedules arranged, I can schedule specific work for my group during the week, during the month"}, {"id": "ios_2778159364", "platform": "App Store", "author": "Swagmantheswag85", "title": "Terrible", "rating": 1, "date": "2018-06-26", "text": "What a terrible use of space on the App Store! It’s a shame we have to use this."}, {"id": "ios_2584982149", "platform": "App Store", "author": "Kirkmelin", "title": "Timeless scheduling", "rating": 5, "date": "2018-05-23", "text": "It allows the user to schedule the employees in the smarter way. It saves time and reduces the complexity of the user while scheduling the employees. On posting the schedule a message is delivered to the schedule employees with their scheduled time and job code. Also, the employees can offer their shift to the different employee if\nhe/she is not available at that particular time."}, {"id": "ios_2576807594", "platform": "App Store", "author": "Arnoldboehm", "title": "Interactive app in the market", "rating": 5, "date": "2018-05-21", "text": "Zip Schedule is very interactive and awesome application for employee scheduling. It is easy to use or we can say user friendly. I have recommend my friends too, to use the application for scheduling."}, {"id": "ios_2569269600", "platform": "App Store", "author": "tomsellack", "title": "Better than HotSchedules", "rating": 5, "date": "2018-05-19", "text": "This app does a lot more than the one we used to use. It’s easy and it’s free which is great."}, {"id": "ios_2559373517", "platform": "App Store", "author": "Solomonpankow", "title": "App for employees", "rating": 5, "date": "2018-05-17", "text": "This is a very useful app for the employee who is working in different organizations or at different stores within the same organization can view his/her shifts in zip schedules."}, {"id": "ios_2551861169", "platform": "App Store", "author": "Casandrawhitted", "title": "Best Scheduling App", "rating": 5, "date": "2018-05-15", "text": "A very awful app through which we can create a schedule very easily."}, {"id": "ios_2545742655", "platform": "App Store", "author": "Shantaypickle", "title": "Excellent Scheduling App", "rating": 4, "date": "2018-05-14", "text": "Our employees love receiving their work schedules through the Zip Schedules mobile app. It makes team communication easy which make everyone happy and saves a lot of time. Now, we are creating more accurate schedule in minutes while getting correct labor costs under control."}, {"id": "ios_2524695453", "platform": "App Store", "author": "Dwightvince", "title": "Great scheduling app", "rating": 5, "date": "2018-05-09", "text": "It's a great app with cool features. The best part of the application is that my managers can communicate with crew employees using the team center."}, {"id": "ios_2520555342", "platform": "App Store", "author": "scottieburse", "title": "App for business", "rating": 5, "date": "2018-05-08", "text": "I absolutely love this app. It's very useful for our business. It helps all of my managers to see their employees schedule and phone number on their phones. They can easily see who is available and can approve shifts, availability changes etc."}, {"id": "ios_2516195879", "platform": "App Store", "author": "anthonygrahamm", "title": "Everything for employee needs", "rating": 4, "date": "2018-05-07", "text": "This is one of the great applications that I have ever used. The best part is that it's free of cost whereas some other applications from other companies charge money for this. This application has almost everything an employee needs to see their schedule and also can swap their shifts with others. I would give this application 4 stars."}, {"id": "ios_2503520370", "platform": "App Store", "author": "rebeljohnson", "title": "Easy to use", "rating": 4, "date": "2018-05-04", "text": "Easy to use app, makes life so much easier to see your schedule and edit in seconds."}, {"id": "ios_2324307790", "platform": "App Store", "author": "genbolanos", "title": "Please improve", "rating": 1, "date": "2018-03-19", "text": "This is honestly the worst app for work and needs some serious improvements ! I’ve had 7shifts and HotSchedules which are awesome and better than this.\nWhat needs improving ?\n1. Notifications: this apps doesn’t notify when our schedules are out or when someone is giving away their shift. \n2. Contacts: for some reason, the contacts went away ??? Now we can’t see people’s contact information, which is needed when we need to get ahold of them. \n3. Messaging: we wouldn’t need contacts info if we could directly message in the app! Or even have a place where we could post messages like 7shifts! \n4. Work schedule: being able to see who is or isn’t working for the day would be helpful. That way we’re not wasting our time messaging people who are already working. \n5. Time off request: apparently at work we have to write down our time off request in a notebook because this app doesn’t let us request time off!! It disappears from the system once approved ??\nPlease ! Improve the app and make it useful to those who use it. There are so many changes that are needed. If I had the power to change what app we use I would."}, {"id": "ios_2214115005", "platform": "App Store", "author": "LV Outback", "title": "Cerca Trova.....you need help, scheduling, accounting and much more!", "rating": 1, "date": "2018-02-16", "text": "Hotschedules puts this scheduling app to shame and I am ashamed that you make Outback employees use this terrible app."}, {"id": "ios_2165583360", "platform": "App Store", "author": "TrvlBella", "title": "Seriously? No improvements yet?!", "rating": 1, "date": "2018-02-04", "text": "It’s been months and we’re still forced to use this inefficient app with absolutely NO improvements so far. Whoever designed it and the one subjecting us to use it not only lack compassion, they might be downright evil. I never write app reviews but my frustration level has reached astronomical proportions!!!"}, {"id": "ios_2072380859", "platform": "App Store", "author": "Timothy teej T", "title": "Horrible options. Buggy", "rating": 1, "date": "2018-01-09", "text": "Don’t expect to be able to do anything but see the day and time you work....maybe. The app is extremely buggy and non user friendly. It sometimes doesn’t even post some of my days. Altametrics is an absolute piece of crap."}, {"id": "ios_2043100501", "platform": "App Store", "author": "ysidro00", "title": "What is this...", "rating": 1, "date": "2017-12-30", "text": "App is unorganized and dysfunctional, Needs a major overhaul. If I’m scheduled in the AM I can’t see if I’m schedule in the PM The only way to find out is to call my employer."}, {"id": "ios_2030032181", "platform": "App Store", "author": "Kj6cea", "title": "Why do I even need this app", "rating": 1, "date": "2017-12-26", "text": "This application is missing a few things:\n*Ability to see your coworkers schedule\n*Ability to see ALL current staff and numbers if they chose to have a visible option. (Why is that even there because there's no staff list?)\n*Ability to swap shifts with ALL applicable staff ( staff scheduled for same shifts should be able to swap outside of availability and during scheduled shifts)\n*Ability to message staff AT ALL (REALLY?)\n\nHard to believe this is at all related to zip schedules...."}, {"id": "ios_2013060176", "platform": "App Store", "author": "The_Luruski", "title": "Would give negative stars if I could", "rating": 1, "date": "2017-12-20", "text": "This app is terrible! Not user friendly and is constantly glitchy. Wish they could see how a real workforce app works so they could mimic it at least."}, {"id": "ios_1959107961", "platform": "App Store", "author": "Lisatruonggg", "title": "Terrible!!!", "rating": 1, "date": "2017-11-29", "text": "Just terrible!"}, {"id": "ios_1921447594", "platform": "App Store", "author": "Ayemannn", "title": "Needs A TON of work", "rating": 1, "date": "2017-11-14", "text": "There is nothing good to say about this app so far other than it needs a ton of work, and from being a previous user of HotSchedules for 7 years, having to switch to this really blows. Here are some requests and suggestions for the developers from an employees standpoint:\n1. This app is not user friendly- you cannot release or pickup shifts \n2. We have no way to see our other coworkers schedule! This by far is highly frustrating and inconvenient. How am I suppose to know wether or not I am the only one scheduled that day/night or who comes in before or after me. Knowing this is very important so employees can plan accordingly.\n3. We cannot message others directly through this application, and since we don't know who is or isn't working we virtually have no way to reach other employees for a quick shift cover if needed.\nThanks! Hope this review helps and this application receives the improvements it's needed QUICKLY."}, {"id": "ios_1897575415", "platform": "App Store", "author": "mfranchs", "title": "Awful", "rating": 1, "date": "2017-11-04", "text": "Disgustingly Awful"}, {"id": "ios_1862323029", "platform": "App Store", "author": "Litte chica", "title": "I wish I could give this app zero stars.", "rating": 1, "date": "2017-10-20", "text": "This is the absolute worst scheduling app out there. After using hotschedules for 8 years this doesn’t even begin to compare. Doesn’t list the section being worked, you can’t see anyone else’s schedule, requests don’t work so we had to switch to using a notebook calendar to request time off. The format is terrible! They should be paying the company to use the app rather than the other way around."}, {"id": "ios_1854180131", "platform": "App Store", "author": "SRO2003", "title": "1 star", "rating": 1, "date": "2017-10-16", "text": "Terrible app! Wouldn't use it if I wasn't forced to for work. Hotshcedules was 100 times better!"}, {"id": "ios_1842998682", "platform": "App Store", "author": "Madidori_44", "title": "This app is absolutely terrible", "rating": 1, "date": "2017-10-11", "text": "I would rather go through the trouble of paper scheduling rather than use this app. If I could give it no stars for making work THAT much more difficult. Make this app user friendly or just get rid of it completely, it does more harm than it does help."}, {"id": "ios_1835968265", "platform": "App Store", "author": "Anthony from Guam", "title": "Needs Improvement", "rating": 2, "date": "2017-10-08", "text": "Coming from Hot Schedules... One feature needed is the ability to see who I’m working with."}, {"id": "ios_1830164679", "platform": "App Store", "author": "madoutbacker", "title": "Terrible", "rating": 1, "date": "2017-10-05", "text": "This app is awful, and it doesn't let you see your coworkers schedules. Half of the time, I can barely see my own schedule. This app needs A TON of improvement. I wish I could go back to HotSchedules."}, {"id": "ios_1797671601", "platform": "App Store", "author": "NikkiD1016", "title": "More like NotSchedules", "rating": 1, "date": "2017-09-18", "text": "I normally don't write reviews but this app is beyond frustrating. This app could probably have great potential but it is lacking in so many areas. You can't see anyone's schedules but your own. There's no way to get shifts covered or swap unless you text/call everyone and bother them. And that's if you have all your coworkers info in the first place. And when messages are sent out through the app they aren't reaching everyone. There's no way to show double shifts or when you're on a double shift with two different job codes. It hasn't even been a week and I miss HotSchedules."}, {"id": "ios_1786000653", "platform": "App Store", "author": "Your boy, blue", "title": "Read me!!", "rating": 1, "date": "2017-09-11", "text": "Hi! I just wanted to say that it is greatly inconvenient to have no access to co-workers via in app-scheduling, which is something my previous app allowed me to do. This is causing an abrupt left turn, in terms of fluidity. I think that it's important to have open communications that allow me to interact with individuals whom I actively see and conduct daily business with on a regular basis, this includes;\n•Ability to see what days I'm working and who I'm working with. \n•Ability to swap and pickup shifts with and from other employees.\nThese issues are really basic, but can still be really easily over looked! However, If things like this are left unaddressed, then they'll never continue to as is a simplicities error, which is annoying at most, resolves then to fester . Just my two cents, thank you for your time. :)"}]};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => d.toISOString().slice(0,10);
const fromEl = document.getElementById("from"), toEl = document.getElementById("to"), platEl = document.getElementById("platform");

document.getElementById("title").textContent = `Reviews Dashboard: ${DATA.company} (${DATA.app})`;
document.getElementById("generated").textContent = "Last sync: " + new Date(DATA.generated).toLocaleString();

const platforms = [...new Set([...Object.keys(DATA.status), ...DATA.reviews.map(r => r.platform)])].sort();
platforms.forEach(p => platEl.insertAdjacentHTML("beforeend", `<option>${esc(p)}</option>`));

function setPreset(days){
  const today = new Date();
  toEl.value = iso(today);
  fromEl.value = days ? iso(new Date(today - days*864e5)) : "";
}

function render(){
  const from = fromEl.value || "0000", to = toEl.value || "9999", plat = platEl.value;
  const list = DATA.reviews.filter(r => r.date >= from && r.date <= to && (!plat || r.platform === plat));

  document.getElementById("tiles").innerHTML = platforms.filter(p => !plat || p === plat).map(p => {
    const st = DATA.status[p] || {}, rs = list.filter(r => r.platform === p);
    const avg = rs.length ? (rs.reduce((a,r) => a + Number(r.rating||0), 0) / rs.length).toFixed(2) : "–";
    const sum = st.summary || {};
    const overall = sum.rating ? `Store rating ${sum.rating}${sum.total_ratings ? " · " + Number(sum.total_ratings).toLocaleString() + " ratings" : ""}` : "";
    const health = st.ok === false
      ? `<div class="small bad">FAILED: ${esc(st.error)}</div>`
      : `<div class="small ok">${st.source === "manual" ? "Manual CSV" : "Auto"} · ${st.last_success ? new Date(st.last_success).toLocaleDateString() : ""}</div>`;
    return `<div class="tile"><div class="name">${esc(p)}</div><div class="v">${rs.length}</div>
      <div class="small muted">reviews in range · avg ${avg}</div><div class="small muted">${esc(overall)}</div>${health}</div>`;
  }).join("");

  document.getElementById("count").textContent = `${list.length} reviews`;
  document.getElementById("rows").innerHTML = list.slice(0, 1000).map(r => `<tr>
    <td>${esc(r.date)}</td><td>${esc(r.platform)}</td>
    <td class="stars">${"★".repeat(Math.round(r.rating||0))}${"☆".repeat(5-Math.round(r.rating||0))}</td>
    <td>${esc(r.author)}</td><td>${r.title ? "<b>"+esc(r.title)+"</b><br>" : ""}${esc(r.text)}</td></tr>`).join("");
}

document.querySelectorAll(".btn").forEach(b => b.onclick = () => {
  document.querySelectorAll(".btn").forEach(x => x.classList.remove("active"));
  b.classList.add("active"); setPreset(Number(b.dataset.days)); render();
});
[fromEl, toEl].forEach(el => el.onchange = () => { document.querySelectorAll(".btn").forEach(x => x.classList.remove("active")); render(); });
platEl.onchange = render;
setPreset(30); render();
</script>
</body>
</html>
