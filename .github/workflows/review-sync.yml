name: Review Sync

on:
  schedule:
    - cron: "30 1 * * *"   # roz subah 7:00 AM IST
  workflow_dispatch:        # Actions tab se manually "Run workflow"
  push:                     # laptop ya manual CSV update hote hi dashboard refresh
    paths:
      - "web_reviews.csv"
      - "web_status.json"
      - "manual_reviews.csv"

permissions:
  contents: write

concurrency:
  group: review-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add reviews_database.json index.html all_reviews.csv
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily review sync"
          git pull --rebase --autostash
          git push
